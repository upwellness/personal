<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MTM FORM Tracker — AW MTM</title>
  <style>
    :root{--bg:#07090d;--panel:#111823;--panel2:#172233;--ink:#f8fafc;--muted:#9fb0c6;--line:#28384d;--gold:#f4c86a;--cyan:#67e8f9;--green:#86efac;--red:#fb7185;--blue:#93c5fd;--violet:#c4b5fd;--orange:#fdba74;--radius:22px;--shadow:0 22px 60px rgba(0,0,0,.36)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 18% 8%,rgba(103,232,249,.15),transparent 32%),radial-gradient(circle at 92% 3%,rgba(244,200,106,.13),transparent 35%),#07090d;color:var(--ink);font-family:"Avenir Next","Sukhumvit Set","Noto Sans Thai",sans-serif;line-height:1.55} button,input,select,textarea{font:inherit} .app{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.brand{background:linear-gradient(135deg,rgba(17,24,35,.92),rgba(10,14,22,.82));border:1px solid rgba(244,200,106,.22);border-radius:30px;padding:26px;box-shadow:var(--shadow);flex:1}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:900}.brand h1{margin:8px 0 6px;font-size:clamp(30px,4vw,58px);letter-spacing:-.04em;line-height:1}.brand p{color:#d8e2ef;max-width:900px}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:14px;padding:10px 13px;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px);border-color:rgba(103,232,249,.5)}.btn.primary{background:linear-gradient(135deg,var(--gold),#fb923c);color:#111827;border:0;font-weight:900}.btn.danger{border-color:rgba(251,113,133,.35);color:#fecdd3}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{background:rgba(17,24,35,.82);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 16px 50px rgba(0,0,0,.24);overflow:hidden}.panelHead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.panelHead h2{margin:0;font-size:20px}.panelBody{padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:linear-gradient(135deg,rgba(23,34,51,.92),rgba(13,18,27,.9));border:1px solid var(--line);border-radius:20px;padding:16px}.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:13px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#0b111a;color:var(--ink);margin-bottom:12px}.list{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 330px);overflow:auto;padding-right:4px}.person{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:18px;padding:13px;cursor:pointer}.person.active{border-color:var(--gold);background:rgba(244,200,106,.08)}.personTop{display:flex;justify-content:space-between;gap:8px}.name{font-weight:900}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:#dbeafe}.stage{height:8px;background:#0b111a;border-radius:999px;overflow:hidden;margin:10px 0 6px}.stage i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));width:0}.small{font-size:12px;color:var(--muted)}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;color:#dbeafe;font-weight:750}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#0b111a;color:var(--ink);outline:none}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(103,232,249,.12)}.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}.tab{border:1px solid var(--line);background:#0b111a;color:#cbd5e1;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:13px}.tab.active{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#06111a;border:0;font-weight:900}.stepHelp{border:1px solid rgba(103,232,249,.2);background:rgba(103,232,249,.06);border-radius:18px;padding:14px;margin-bottom:14px;color:#d9fbff}.checkrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(255,255,255,.03)}.check input{width:auto;margin-top:4px}.timeline{display:flex;flex-direction:column;gap:10px}.log{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(255,255,255,.03);border-radius:12px}.footerBar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);background:#0b111a}.hidden{display:none!important}.empty{padding:40px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#111827;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.import{display:none}@media(max-width:980px){.top{flex-direction:column}.actions{justify-content:flex-start}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.formGrid,.checkrow{grid-template-columns:1fr}.list{max-height:380px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><section class="brand"><div class="eyebrow">MTM FORM TRACKER</div><h1>รายชื่อ + 7 Step Follow-up</h1><p>WebApp สำหรับใช้รายชื่อและบันทึกติดตามตามสิ่งที่จิ้นอธิบาย: ถามให้มาก ฟังให้จบ ไม่รีบ Sponsor แล้วค่อยส่ง Message เมื่อจังหวะพร้อม ข้อมูลเก็บใน browser เครื่องนี้ด้วย localStorage</p></section><div class="actions"><button class="btn primary" id="newBtn">+ เพิ่มรายชื่อ</button><button class="btn" id="exportBtn">Export JSON</button><button class="btn" id="csvBtn">Export CSV</button><button class="btn" id="importBtn">Import</button><input class="import" type="file" id="importFile" accept="application/json"><button class="btn danger" id="resetBtn">ล้างข้อมูลทั้งหมด</button></div></header>
    <section class="stats" id="stats"></section>
    <main class="layout"><aside class="panel"><div class="panelHead"><h2>รายชื่อ</h2><span class="badge" id="countBadge">0 คน</span></div><div class="panelBody"><input class="search" id="search" placeholder="ค้นชื่อ / tag / note"><div class="list" id="peopleList"></div></div></aside><section class="panel"><div id="editor"></div></section></main>
  </div><div class="toast" id="toast"></div>
  <script>
    const STEPS=[
      {id:'mindset',short:'ตั้งหลัก',title:'1 ตั้งหลัก: หา Partner ไม่ใช่แค่คนสมัคร',help:'ก่อนคุยให้บันทึกว่าเรามองคนนี้อย่างไร ต้องการช่วยจริงไหม และมีอคติ/ความกลัวอะไรที่ต้อง QC ก่อนเริ่ม'},
      {id:'list',short:'รายชื่อ',title:'2 รายชื่อ: เอาความเป็นไปได้ออกจากหัว',help:'รายชื่อคือระบบทำงาน ไม่ใช่ความจำ เขียนทุกคนก่อน อย่าเพิ่งตัดสินเพราะเคยปฏิเสธหรือคิดว่าไม่ใช่'},
      {id:'f',short:'F',title:'3 F / Family: รู้สถานการณ์และอุ่นความสัมพันธ์',help:'คุยเพื่อฟังว่า “ตอนนี้เขาเป็นอย่างไร” มีอะไรไม่โอเคไหม จบด้วยการนัด/ขอคุยต่อ ไม่รีบชวน'},
      {id:'o',short:'O',title:'4 O / OK-Outcome: แล้วที่โอเคคืออะไร',help:'ทำให้ปัญหา/ความฝันเป็นรูปธรรม และดูว่าเขาจริงจังกับการแก้ปัญหาหรือแค่บ่น'},
      {id:'r',short:'R',title:'5 R / Recreation-Reality: เวลาและสิ่งที่พร้อมแลก',help:'เช็คเวลาจริง พลังจริง และความเป็นไปได้ของแผน เขาจะเห็นเองว่าวิธีเดิมตอบโจทย์ไหม'},
      {id:'m',short:'M',title:'6 M / Message: ทวน ตีกรอบ เสนอ แล้วเงียบ',help:'ส่งสารเมื่อเข้าใจครบแล้วเท่านั้น เสนออย่างอ่อนน้อม ไม่ต้อนเข้ามุม ให้สิทธิ์ตัดสินใจอยู่กับเขา'},
      {id:'qc',short:'QC',title:'7 Objection + Follow-up + QC',help:'ตอบข้อโต้แย้งด้วยคำถามกลับ บันทึก next step และ QC ว่าเราถามมากขึ้น/พูดน้อยลงจริงไหม'}
    ];
    const KEY='aw-mtm-form-tracker-v1';
    const blank=()=>({id:crypto.randomUUID(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),name:'',phone:'',relationship:'',source:'',tags:'',priority:'กลาง',owner:'',status:'mindset',lastContact:'',nextFollowup:'',score:3,steps:{mindset:{partnerFit:'',whyHelp:'',fearBias:'',goalBeforeTalk:'',done:false},list:{category:'',reasonOnList:'',bestOpening:'',contactPlan:'',done:false},f:{situation:'',notOk:'',familyWorkHealth:'',warmNotes:'',summary:'',nextQuestion:'',done:false},o:{okMeaning:'',dreamProject:'',numbersTimeline:'',investmentRisk:'',seriousness:'',done:false},r:{workSchedule:'',availableTime:'',tradeoff:'',fallback:'',worthIt:'',done:false},m:{frameSummary:'',permission:'',messageScript:'',response:'',nextStep23Days:'',done:false},qc:{objections:'',questionBack:'',oldHabit:'',newHabit:'',nextQuestions:'',done:false}},logs:[]});
    let data=load(); let selected=data.people[0]?.id||null; let activeStep='mindset';
    function load(){try{return JSON.parse(localStorage.getItem(KEY))||{people:[]}}catch{return{people:[]}}}
    function save(){localStorage.setItem(KEY,JSON.stringify(data));}
    function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    function current(){return data.people.find(p=>p.id===selected)}
    function stepIndex(p){return Math.max(0,STEPS.findIndex(s=>s.id===p.status));}
    function progress(p){let done=STEPS.filter(s=>p.steps[s.id]?.done).length;return Math.round(done/STEPS.length*100)}
    function esc(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
    function render(){renderStats();renderList();renderEditor();}
    function renderStats(){const total=data.people.length;const due=data.people.filter(p=>p.nextFollowup&&new Date(p.nextFollowup)<=new Date()).length;const ready=data.people.filter(p=>p.status==='m'||p.status==='qc').length;const avg=total?Math.round(data.people.reduce((a,p)=>a+progress(p),0)/total):0;document.getElementById('stats').innerHTML=[['รายชื่อทั้งหมด',total],['ต้องติดตาม',due],['พร้อม Message/QC',ready],['Progress เฉลี่ย',avg+'%']].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}
    function renderList(){const q=document.getElementById('search').value.toLowerCase();let list=data.people.filter(p=>[p.name,p.tags,p.relationship,p.source,Object.values(p.steps).map(o=>Object.values(o).join(' ')).join(' ')].join(' ').toLowerCase().includes(q));document.getElementById('countBadge').textContent=`${data.people.length} คน`;document.getElementById('peopleList').innerHTML=list.length?list.map(p=>`<div class="person ${p.id===selected?'active':''}" data-id="${p.id}"><div class="personTop"><span class="name">${esc(p.name||'ยังไม่ตั้งชื่อ')}</span><span class="badge">${STEPS[stepIndex(p)]?.short}</span></div><div class="small">${esc(p.relationship||'ความสัมพันธ์?')} · ${esc(p.priority||'กลาง')}</div><div class="stage"><i style="width:${progress(p)}%"></i></div><div class="small">Next: ${p.nextFollowup||'-'} · ${esc(p.tags||'')}</div></div>`).join(''):'<div class="empty">ยังไม่มีรายชื่อ กด “เพิ่มรายชื่อ” เพื่อเริ่ม</div>';document.querySelectorAll('.person').forEach(el=>el.onclick=()=>{selected=el.dataset.id;activeStep=current().status||'mindset';render();});}
    function renderEditor(){const p=current();const ed=document.getElementById('editor');if(!p){ed.innerHTML='<div class="empty"><h2>เริ่มจากเพิ่มรายชื่อ</h2><p>ใช้ระบบนี้เพื่อบันทึกการคุยทีละคนตาม 7 Step</p></div>';return}ed.innerHTML=`<div class="panelHead"><h2>${esc(p.name||'รายชื่อใหม่')}</h2><div><button class="btn" id="saveBtn">บันทึก</button> <button class="btn danger" id="deleteBtn">ลบ</button></div></div><div class="tabs">${STEPS.map(s=>`<button class="tab ${activeStep===s.id?'active':''}" data-step="${s.id}">${s.short}</button>`).join('')}</div><div class="panelBody"><div class="formGrid">${baseFields(p)}</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div id="stepForm"></div></div><div class="footerBar"><span class="small">Updated: ${new Date(p.updatedAt).toLocaleString('th-TH')}</span><button class="btn primary" id="markDoneBtn">บันทึก Step นี้และไปต่อ</button></div>`;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{activeStep=t.dataset.step;renderEditor();});document.getElementById('saveBtn').onclick=collect;document.getElementById('deleteBtn').onclick=()=>{if(confirm('ลบรายชื่อนี้?')){data.people=data.people.filter(x=>x.id!==p.id);selected=data.people[0]?.id||null;save();render();}};document.getElementById('markDoneBtn').onclick=()=>{collect(false);const p=current();p.steps[activeStep].done=true;p.status=activeStep;const idx=STEPS.findIndex(s=>s.id===activeStep);if(idx<STEPS.length-1){activeStep=STEPS[idx+1].id;p.status=activeStep}addLog(p,`บันทึก ${STEPS[idx].title}`);save();render();toast('บันทึกแล้ว')};renderStepForm(p);attachAutoSave();}
    function baseFields(p){return `<div class="field"><label>ชื่อ</label><input data-k="name" value="${esc(p.name)}"></div><div class="field"><label>เบอร์/ช่องทางติดต่อ</label><input data-k="phone" value="${esc(p.phone)}"></div><div class="field"><label>ความสัมพันธ์</label><input data-k="relationship" value="${esc(p.relationship)}" placeholder="เพื่อน / ญาติ / ลูกค้า / เพื่อนร่วมงาน"></div><div class="field"><label>แหล่งที่มา</label><input data-k="source" value="${esc(p.source)}" placeholder="งานเก่า / Facebook / LINE / referral"></div><div class="field"><label>Priority</label><select data-k="priority"><option ${p.priority==='สูง'?'selected':''}>สูง</option><option ${p.priority==='กลาง'?'selected':''}>กลาง</option><option ${p.priority==='ต่ำ'?'selected':''}>ต่ำ</option></select></div><div class="field"><label>Step ปัจจุบัน</label><select data-k="status">${STEPS.map(s=>`<option value="${s.id}" ${p.status===s.id?'selected':''}>${s.title}</option>`).join('')}</select></div><div class="field"><label>ติดต่อครั้งล่าสุด</label><input type="date" data-k="lastContact" value="${esc(p.lastContact)}"></div><div class="field"><label>ติดตามครั้งถัดไป</label><input type="date" data-k="nextFollowup" value="${esc(p.nextFollowup)}"></div><div class="field full"><label>Tags</label><input data-k="tags" value="${esc(p.tags)}" placeholder="เช่น สุขภาพ, รายได้เพิ่ม, เจ้าของธุรกิจ"></div>`}
    function renderStepForm(p){const s=STEPS.find(x=>x.id===activeStep);const v=p.steps[activeStep];let fields={mindset:[['partnerFit','ทำไมเขาเป็น Partner/ผู้จัดการที่น่าสนใจ'],['whyHelp','เราอยากช่วยเขาเรื่องอะไรจริง ๆ'],['fearBias','อคติ/ความกลัว/ภาพจำการถูกปฏิเสธที่ต้อง QC'],['goalBeforeTalk','เป้าหมายก่อนคุย: ฟังอะไรให้รู้ ไม่ใช่ปิดอะไร']],list:[['category','หมวดรายชื่อ'],['reasonOnList','เหตุผลที่ควรเขียนเขาลงรายชื่อ'],['bestOpening','ประโยคเปิด/เรื่องอุ่นเครื่องที่เป็นธรรมชาติ'],['contactPlan','แผนติดต่อ: ทัก / โทร / นัดเจอ / รอจังหวะ']],f:[['situation','ตอนนี้ชีวิตเขาเป็นอย่างไร'],['notOk','มีอะไรไม่โอเคหรือไม่เป็นอย่างที่ควรไหม'],['familyWorkHealth','ข้อมูลครอบครัว/งาน/สุขภาพ/บ้าน/ลูก/พ่อแม่'],['warmNotes','สิ่งที่ทำให้คุยสนุก/ปลอดภัย'],['summary','สรุปกลับให้เขารู้ว่าเราเข้าใจ'],['nextQuestion','คำถามถัดไป/นัดคุยต่อ']],o:[['okMeaning','แล้วที่โอเคสำหรับเขาคืออะไร'],['dreamProject','Project/Idea/ความฝันที่เขาพูดถึง'],['numbersTimeline','ตัวเลข/ยอดขาย/รายได้/เวลาที่ต้องเห็นผล'],['investmentRisk','ต้นทุน ความเสี่ยง คู่แข่ง สิ่งที่ต้องแลก'],['seriousness','เขาจริงจังแค่ไหนหรือแค่บ่น']],r:[['workSchedule','ตารางงานจริง: ทำงานกี่วัน เลิกกี่โมง หยุดวันไหน'],['availableTime','เวลาที่อาจเอามาทำงานเสริม'],['tradeoff','เขาพร้อมแลกอะไรบ้าง'],['fallback','ถ้าไม่สำเร็จจะทำอะไร'],['worthIt','รายได้/ผลลัพธ์คุ้มกับเวลาหรือไม่']],m:[['frameSummary','ทวนกรอบ: ปัญหา เป้าหมาย เวลา เงื่อนไข'],['permission','ขออนุญาต/เปิดทางก่อนเสนออย่างไร'],['messageScript','Message/script ที่จะใช้จริง'],['response','คำตอบ/อารมณ์/สัญญาณหลังเสนอ'],['nextStep23Days','นัด next step ภายใน 2–3 วัน']],qc:[['objections','ข้อโต้แย้ง/ข้อสงสัยที่เกิดขึ้น'],['questionBack','คำถามกลับที่ใช้ตอบโดยไม่เผชิญหน้า'],['oldHabit','นิสัยเก่าที่เผลอทำ'],['newHabit','นิสัยใหม่ที่ทำได้ดี'],['nextQuestions','พิมพ์เขียวคำถามสำหรับครั้งหน้า']]};document.getElementById('stepForm').innerHTML=`<div class="stepHelp"><b>${s.title}</b><br>${s.help}</div><div class="formGrid">${fields[activeStep].map(([k,l])=>`<div class="field ${['summary','nextQuestion','messageScript','response','nextStep23Days','nextQuestions'].includes(k)?'full':''}"><label>${l}</label><textarea data-stepk="${k}">${esc(v[k]||'')}</textarea></div>`).join('')}<div class="field full"><label class="check"><input type="checkbox" data-stepdone ${v.done?'checked':''}> Step นี้ครบแล้ว</label></div></div><h3>Activity Log</h3><div class="timeline">${(p.logs||[]).slice().reverse().map(l=>`<div class="log"><b>${new Date(l.at).toLocaleString('th-TH')}</b><br>${esc(l.text)}</div>`).join('')||'<div class="small">ยังไม่มี log</div>'}</div>`;}
    function collect(rerender=true){const p=current();if(!p)return;document.querySelectorAll('[data-k]').forEach(el=>p[el.dataset.k]=el.value);document.querySelectorAll('[data-stepk]').forEach(el=>p.steps[activeStep][el.dataset.stepk]=el.value);const cb=document.querySelector('[data-stepdone]');if(cb)p.steps[activeStep].done=cb.checked;p.updatedAt=new Date().toISOString();save();if(rerender){render();toast('บันทึกแล้ว')}}
    function attachAutoSave(){document.querySelectorAll('[data-k],[data-stepk],[data-stepdone]').forEach(el=>{const handler=()=>collect(false);el.addEventListener('change',handler);if(el.tagName!=='SELECT'&&el.type!=='checkbox')el.addEventListener('input',handler);});}
    function addLog(p,text){p.logs=p.logs||[];p.logs.push({at:new Date().toISOString(),text});}
    document.getElementById('newBtn').onclick=()=>{const p=blank();p.name='';data.people.unshift(p);selected=p.id;activeStep='mindset';save();render();};document.getElementById('search').oninput=renderList;
    document.getElementById('exportBtn').onclick=()=>download('aw-mtm-form-tracker.json',JSON.stringify(data,null,2),'application/json');
    document.getElementById('csvBtn').onclick=()=>{const rows=[['name','phone','relationship','priority','status','nextFollowup','tags','progress']].concat(data.people.map(p=>[p.name,p.phone,p.relationship,p.priority,STEPS[stepIndex(p)].short,p.nextFollowup,p.tags,progress(p)+'%']));download('aw-mtm-form-tracker.csv',rows.map(r=>r.map(x=>'"'+String(x||'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')};
    document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);selected=data.people?.[0]?.id||null;save();render();toast('Import แล้ว')}catch{alert('ไฟล์ JSON ไม่ถูกต้อง')}};r.readAsText(f)};
    document.getElementById('resetBtn').onclick=()=>{if(confirm('ล้างข้อมูลทั้งหมดใน browser นี้?')){data={people:[]};selected=null;save();render();}};
    function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
    if(!data.people.length){const p=blank();p.name='ตัวอย่าง: คุณเอ';p.relationship='เพื่อนเก่า';p.tags='รายได้เพิ่ม, สุขภาพ, เจ้าของธุรกิจ';p.steps.mindset.partnerFit='มีความรับผิดชอบสูง เคยบริหารทีมเล็ก ๆ';p.steps.list.reasonOnList='ชีวิตเปลี่ยนจากเมื่อก่อน มีภาระครอบครัวเพิ่ม';p.logs=[{at:new Date().toISOString(),text:'ตัวอย่างข้อมูล ลบหรือแก้ไขได้'}];data.people=[p];selected=p.id;save();}
    render();
  </script>
</body>
</html>
