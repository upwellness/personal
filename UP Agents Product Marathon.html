    content: ''; position: absolute; pointer-events:none;

    border-radius: 12px;

    transition: opacity 0.4s ease, transform 0.4s ease;

  .controls {

    padding: 10px 18px; border-radius: 100px;

    color: #F5F0EB;

    cursor: pointer; font-weight: bold; font-size: 10px;

    position: fixed; inset: 0; z-index: 100;
    background: rgba(15, 14, 12, 0.94);
    backdrop-filter: blur(20px);
    overflow-y: auto;
    display: none;
    padding: 60px;

  .index .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

  .index .thumb {
    aspect-ratio: 16 / 9; border-radius: 8px; cursor: pointer;

    overflow: hidden; position: relative;

/* ─── Render functions ─── */

function svgMesh(colors, opacity=0.35) {
  return `
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
      <div class="mesh-a absolute -top-32 -left-20 rounded-full" style="width:40%;height:60%;background:radial-gradient(circle, ${colors[0]}, transparent 65%);opacity:${opacity};filter:blur(80px);"></div>
      <div class="mesh-b absolute top-20 right-0 rounded-full" style="width:38%;height:55%;background:radial-gradient(circle, ${colors[1]}, transparent 65%);opacity:${opacity};filter:blur(80px);"></div>
      <div class="mesh-c absolute bottom-0 left-1/3 rounded-full" style="width:42%;height:55%;background:radial-gradient(circle, ${colors[2]}, transparent 65%);opacity:${opacity};filter:blur(90px);"></div>
    </div>
  `;
}

function eyebrow(text, color = C.rose) {
  return `<div class="font-mono font-bold uppercase" style="font-size:0.9cqw;letter-spacing:0.3em;color:${color};">${text}</div>`;

function pageNum(n) {

/* ─── Slide controller ─── */
let current = 0;
const stage = document.getElementById('slide');

function go(idx) {
  current = Math.max(0, Math.min(idx, SLIDES.length - 1));
  const s = SLIDES[current];
  const render = RENDERERS[s.kind];
  if (render) {
    stage.innerHTML = render(s);
    stage.classList.add('active');
  }
  document.getElementById('counter').textContent = `${String(current + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
  document.getElementById('progress').style.width = `${((current + 1) / SLIDES.length) * 100}%`;
}

document.getElementById('prev').onclick = () => go(current - 1);
document.getElementById('next').onclick = () => go(current + 1);
document.getElementById('menuBtn').onclick = () => openIndex();
document.getElementById('closeIndex').onclick = () => closeIndex();

function openIndex() {
  const grid = document.getElementById('thumbs');
  grid.innerHTML = SLIDES.map((s, i) => {
    const title = s.title1 || s.titleEn || s.nameEn || s.title || s.eyebrow || 'Slide';
    const bg = (s.kind === 'cover' || s.kind === 'quote' || s.kind === 'mnemonic' || s.kind === 'closing') ? C.ink : C.cream;
    const fg = (bg === C.ink) ? C.cream : C.ink;
    return `
      <div class="thumb" onclick="closeIndex();go(${i})" style="background:${bg};">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;">
          <div>
            <div class="font-mono font-bold" style="font-size:8px;letter-spacing:0.2em;color:${fg};opacity:0.5;">${String(i+1).padStart(2,'0')}</div>
            <div class="font-display" style="font-size:14px;line-height:1.1;margin-top:4px;color:${fg};">${title}</div>
          </div>
        </div>
        <div class="label"><span class="n">${String(i+1).padStart(2,'0')}</span> · ${s.kind.toUpperCase()}</div>
      </div>
    `;
  }).join('');
  document.getElementById('index').classList.add('open');
}
function closeIndex() {
  document.getElementById('index').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp')                    { e.preventDefault(); go(current - 1); }
  if (e.key === 'Escape')                                              closeIndex();
  if (e.key === 'Home')                                                go(0);
  if (e.key === 'End')                                                 go(SLIDES.length - 1);
  if (e.key === 'i' || e.key === 'I')                                  openIndex();
});

go(0);
</script>
