<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UP Wellness · Knowledge Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --rose: #8C4C4C; --rose-deep: #6B3535; --rose-soft: #F4E6E6; --rose-ultra: #FAF3F2;
    --green: #396755; --green-deep: #2A4F40; --green-soft: #E6EFEA;
    --cream: #F5F0EB; --ink: #1F1F1F; --ink-60: #6B6B6B; --ink-40: #A8A5A0;
    --amber: #B8860B;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Sarabun', 'Inter', sans-serif;
    background: var(--cream);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.7;
  }
  .font-head { font-family: 'Inter', sans-serif; letter-spacing: -0.02em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .font-thai { font-family: 'Sarabun', sans-serif; }

  /* Animated mesh gradient hero */
  .hero-mesh {
    background:
      radial-gradient(at 12% 20%, rgba(140, 76, 76, 0.85) 0%, transparent 50%),
      radial-gradient(at 88% 25%, rgba(184, 134, 11, 0.45) 0%, transparent 50%),
      radial-gradient(at 25% 88%, rgba(57, 103, 85, 0.85) 0%, transparent 55%),
      radial-gradient(at 75% 75%, rgba(140, 76, 76, 0.4) 0%, transparent 55%),
      linear-gradient(135deg, #6B3535 0%, #8C4C4C 35%, #B8860B 65%, #396755 100%);
    background-size: 200% 200%;
    animation: meshShift 25s ease-in-out infinite;
  }
  @keyframes meshShift {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
  }

  /* Gradient overlays per section */
  .grad-rose-soft  { background: linear-gradient(135deg, #FAF3F2 0%, #F4E6E6 60%, #fff 100%); }
  .grad-green-soft { background: linear-gradient(135deg, #F0F8F4 0%, #E6EFEA 60%, #fff 100%); }
  .grad-amber-soft { background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 60%, #fff 100%); }
  .grad-cream-soft { background: linear-gradient(135deg, #FFFDFA 0%, #F5F0EB 60%, #fff 100%); }

  .glow-rose  { box-shadow: 0 12px 40px -12px rgba(140,76,76,.4); }
  .glow-green { box-shadow: 0 12px 40px -12px rgba(57,103,85,.4); }
  .glow-amber { box-shadow: 0 12px 40px -12px rgba(184,134,11,.4); }

  @keyframes slide-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim-in { animation: slide-up 0.6s ease-out backwards; }

  /* Status pills */
  .pill-ok       { background: #DCFCE7; color: #166534; }
  .pill-revise   { background: #FEF3C7; color: #92400E; }
  .pill-unclear  { background: #DBEAFE; color: #1E40AF; }
  .pill-wrong    { background: #FEE2E2; color: #B91C1C; }
  .pill-neutral  { background: #F1F5F9; color: #475569; }

  /* Feedback panel slide */
  .panel-enter { animation: slide-in 0.3s ease-out; }
  @keyframes slide-in {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }

  @media print {
    .no-print { display: none !important; }
    body { background: white; font-size: 13px; }
    section { break-inside: avoid; }
  }
</style>
</head>
<body>
<div id="root">
  <div style="padding: 60px 24px; max-width: 600px; margin: 0 auto; text-align: center; font-family: Sarabun, sans-serif;">
    <div style="font-size: 14px; color: #8C4C4C; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;">UP Wellness · Bible Loading</div>
    <div style="margin-top: 16px; font-size: 24px; font-weight: 800; color: #1F1F1F;">กำลังโหลด...</div>
    <div id="error-pane" style="margin-top: 24px; padding: 16px; background: #FEE2E2; color: #991B1B; border-radius: 12px; font-family: monospace; font-size: 13px; text-align: left; white-space: pre-wrap; display: none;"></div>
  </div>
</div>

<script>
window.addEventListener("error", function(e) {
  var p = document.getElementById("error-pane");
  if (p) { p.style.display = "block"; p.textContent = "Error: " + e.message + "\nLine: " + e.lineno; }
});
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

<script>
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

const STORAGE_KEY = "up-wellness-bible-feedback-v1";

/* ─── DATA ────────────────────────────────────────── */

const SECTIONS = [
  { id: "identity", label: "Identity", num: "01" },
  { id: "voice", label: "Voice", num: "02" },
  { id: "overview", label: "ภาพรวม 2 Tier", num: "03" },
  { id: "uplabs", label: "UP Labs", num: "04" },
  { id: "fullcourse", label: "Full Course", num: "05" },
  { id: "decision", label: "Decision", num: "06" },
  { id: "sales", label: "Sales", num: "07" },
  { id: "products", label: "Products", num: "08" },
  { id: "clinical", label: "Clinical", num: "09" },
  { id: "ladder", label: "Pricing", num: "10" },
  { id: "ops", label: "Operating", num: "11" },
];

const STATUS_OPTIONS = [
  { id: "ok",       label: "✓ ถูกต้อง",   color: "pill-ok" },
  { id: "revise",   label: "✏️ ปรับปรุง", color: "pill-revise" },
  { id: "unclear",  label: "❓ ไม่ชัด",    color: "pill-unclear" },
  { id: "wrong",    label: "🚨 ผิด",      color: "pill-wrong" },
];

/* ─── Top-level UI ────────────────────────────────── */

function Hero({ feedbackCount }) {
  return html`
    <header className="hero-mesh text-white relative overflow-hidden">
      <div className="absolute inset-0 bg-black/15"></div>
      <div className="relative mx-auto max-w-6xl px-6 py-20 md:py-28">
        <div className="flex flex-wrap items-center gap-2 mb-4">
          <span className="rounded-full bg-white/15 backdrop-blur px-3 py-1 text-xs font-mono uppercase tracking-widest border border-white/20">
            Knowledge Bible
          </span>
          <span className="rounded-full bg-amber-500/30 backdrop-blur px-3 py-1 text-xs font-bold border border-amber-300/30">
            v1 · 16 พ.ค. 2569
          </span>
          ${feedbackCount > 0 && html`
            <span className="rounded-full bg-rose-500/40 backdrop-blur px-3 py-1 text-xs font-bold border border-white/20">
              ✏️ Feedback ${feedbackCount}
            </span>`}
        </div>
        <h1 className="font-head text-5xl md:text-7xl font-extrabold leading-[0.95] tracking-tight">
          UP Wellness<br/>
          <span className="bg-gradient-to-r from-amber-200 via-white to-rose-200 bg-clip-text text-transparent">
            Knowledge Bible
          </span>
        </h1>
        <p className="mt-7 max-w-3xl text-xl md:text-2xl text-white/90 leading-relaxed font-thai">
          ฉบับสมบูรณ์ · Anti-aging + Longevity Practice<br/>
          <span className="text-white/70 text-lg">Brand · Full Course · UP Labs · Decision · Sales · Product · Clinical</span>
        </p>
        <div className="mt-12 grid grid-cols-2 md:grid-cols-4 gap-3 max-w-4xl">
          <${HeroStat} label="Sections" value="11" sub="หัวข้อ" />
          <${HeroStat} label="Products" value="20+" sub="Nutrilite TH" />
          <${HeroStat} label="Two Tiers" value="2" sub="UP Labs + Full Course" />
          <${HeroStat} label="Verified" value="✓" sub="amway.co.th 2026" />

        <div className="mt-10 inline-flex items-center gap-2 rounded-full bg-white/10 backdrop-blur px-4 py-2 text-sm text-white/80 border border-white/15">
          <span>💡</span>
          <span>Interactive review · กดปุ่ม "✏️ Feedback" ที่ section ใดเพื่อให้คอมเมนต์</span>

}

function HeroStat({ label, value, sub }) {
  return html`
    <div className="rounded-2xl bg-white/10 backdrop-blur px-5 py-4 border border-white/15">
      <div className="text-[10px] uppercase tracking-wider text-white/65 font-mono">${label}</div>
      <div className="mt-1 font-head text-3xl md:text-4xl font-extrabold leading-none">${value}</div>
      <div className="text-xs text-white/65 mt-1.5">${sub}</div>
    </div>`;
}

function StickyNav({ active, onJump, feedback, onOpenPanel }) {
  return html`
    <nav className="no-print sticky top-0 z-30 bg-white/85 backdrop-blur-lg border-b border-rose-100/60">
      <div className="mx-auto max-w-7xl px-4 py-3 flex flex-wrap items-center gap-1">
        ${SECTIONS.map((s) => {
          const hasFeedback = feedback[s.id] && (feedback[s.id].status || feedback[s.id].note);
          const isActive = active === s.id;
          return html`
            <button key=${s.id}
              onClick=${() => onJump(s.id)}
              className=${"rounded-full px-3 py-1.5 text-xs font-bold transition-all flex items-center gap-1.5 " +
                (isActive ? "bg-stone-900 text-white shadow-md" : "text-stone-600 hover:bg-stone-100")}>
              <span className="opacity-60 font-mono">${s.num}</span>
              <span>${s.label}</span>
              ${hasFeedback && html`<span className="h-1.5 w-1.5 rounded-full bg-rose-500"></span>`}
            </button>`;
        })}
        <div className="ml-auto flex items-center gap-2">
          <button onClick=${onOpenPanel}
            className="rounded-full bg-rose-700 text-white px-4 py-1.5 text-xs font-bold hover:bg-rose-800 transition-colors flex items-center gap-1.5">
            📋 ดู Feedback (${Object.values(feedback).filter(f => f.status || f.note).length})
          </button>
        </div>
      </div>
    </nav>`;
}

function SectionLabel({ number, title, accent = "rose", subtitle }) {
  const accentColor = {
    rose: "text-rose-700", green: "text-emerald-700", amber: "text-amber-700",
    purple: "text-purple-700", blue: "text-blue-700", ink: "text-stone-700"
  }[accent];
  return html`
    <div className="mb-8">
      <div className="flex items-baseline gap-3 mb-2">
        <span className=${"font-mono text-xs font-bold tracking-[0.2em] " + accentColor}>${number}</span>
        <h2 className="font-head text-3xl md:text-5xl font-extrabold tracking-tight text-stone-900">${title}</h2>
      </div>
      ${subtitle && html`<p className="font-thai text-lg text-stone-600 leading-relaxed">${subtitle}</p>`}
    </div>`;
}

function FeedbackWidget({ sectionId, feedback, onUpdate }) {
  const [open, setOpen] = useState(false);
  const current = feedback[sectionId] || {};

  const setStatus = (status) => {
    onUpdate(sectionId, { ...current, status });
  };
  const setNote = (note) => {
    onUpdate(sectionId, { ...current, note });
  };

  const hasContent = current.status || current.note;
  const pillClass = current.status ?
    STATUS_OPTIONS.find(s => s.id === current.status)?.color : "pill-neutral";

  return html`
    <div className="no-print mt-8 rounded-2xl border border-stone-200 bg-white/70 backdrop-blur p-4 md:p-5">
      <button onClick=${() => setOpen(!open)}
        className="w-full flex items-center justify-between gap-3 text-left">
        <div className="flex items-center gap-2">
          <span className="text-lg">✏️</span>
          <span className="font-mono text-[11px] uppercase tracking-widest text-stone-500 font-bold">Feedback</span>
          ${hasContent && html`
            <span className=${"rounded-full px-2 py-0.5 text-[10px] font-bold " + pillClass}>
              ${current.status ? STATUS_OPTIONS.find(s => s.id === current.status)?.label : "มี note"}
            </span>`}
        </div>
        <span className="text-stone-400 text-sm">${open ? "▲" : "▼"}</span>
      </button>

      ${open && html`
        <div className="mt-4 space-y-3">
          <div className="flex flex-wrap gap-2">
            ${STATUS_OPTIONS.map((s) => html`
              <button key=${s.id}
                onClick=${() => setStatus(current.status === s.id ? null : s.id)}
                className=${"rounded-full px-3 py-1.5 text-xs font-bold transition-all " +
                  (current.status === s.id ? s.color + " ring-2 ring-offset-1 ring-stone-400" : "bg-stone-100 text-stone-500 hover:bg-stone-200")}>
                ${s.label}
              </button>`)}
          </div>
          <textarea
            value=${current.note || ""}
            onChange=${(e) => setNote(e.target.value)}
            placeholder="คอมเมนต์ · ที่อยากแก้ · ที่ขัด · ข้อมูลเพิ่ม..."
            rows="3"
            className="w-full rounded-xl border border-stone-200 bg-white px-4 py-3 text-sm font-thai placeholder:text-stone-300 focus:border-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-100"
          />
        </div>`}
    </div>`;
}

/* ─── SECTIONS ──────────────────────────────────── */

function S1_Identity({ feedback, onUpdate }) {

          subtitle="ที่ปรึกษาสุขภาพมืออาชีพ ไม่ใช่ chatbot ขายของ · เป็นที่ปรึกษาก่อน นักขายทีหลัง"/>

        <div className="grid md:grid-cols-2 gap-6">

            <ul className="space-y-3 font-thai text-stone-700">
              <li className="flex gap-3"><span className="font-bold text-rose-700 shrink-0">01</span><span>ให้ข้อมูลสุขภาพถูกต้อง · อ้างอิงงานวิจัย · ไม่มั่ว ไม่เดา</span></li>

              <li className="flex gap-3"><span className="font-bold text-rose-700 shrink-0">03</span><span>สร้างความน่าเชื่อถือในฐานะผู้เชี่ยวชาญ · ไม่ใช่นักขาย</span></li>
              <li className="flex gap-3"><span className="font-bold text-rose-700 shrink-0">04</span><span>แนะนำ Nutrilite / Partner Program อย่างเนียน · ในบริบทเหมาะสม</span></li>
            </ul>
          </div>

          <div className="rounded-3xl bg-white p-6 md:p-8 border border-stone-100">
            <div className="font-mono text-xs uppercase tracking-widest text-stone-500 font-bold mb-3">📊 บริการหลัก</div>
            <ul className="space-y-2 font-thai text-stone-700 text-sm">

          </div>
        </div>

        <div className="mt-6 rounded-3xl bg-gradient-to-br from-rose-700 to-stone-900 text-white p-6 md:p-8">
          <div className="font-mono text-xs uppercase tracking-widest text-rose-200 font-bold mb-4">🚀 Positioning · ต่างจาก Amway ทั่วไป</div>
          <div className="grid md:grid-cols-2 gap-4">
            <div className="rounded-2xl bg-white/10 backdrop-blur p-4">
              <div className="text-xs text-white/60 font-mono uppercase mb-2">Amway ทั่วไป</div>
              <ul className="space-y-1.5 text-sm font-thai">
                <li>ขายของก่อน</li>
                <li>Testimonial เดี่ยวๆ</li>
                <li>Close deal ระยะสั้น</li>
                <li>ทำให้อยากซื้อก่อน</li>
              </ul>
            </div>
            <div className="rounded-2xl bg-amber-500/20 backdrop-blur p-4 border border-amber-300/30">
              <div className="text-xs text-amber-100 font-mono uppercase mb-2">UP Wellness</div>
              <ul className="space-y-1.5 text-sm font-thai font-semibold">
                <li>ที่ปรึกษาก่อน · ขายทีหลัง</li>
                <li>Evidence-based · peer-reviewed</li>
                <li>Trust ระยะยาว</li>
                <li>ให้ความรู้ก่อน</li>
              </ul>
            </div>
          </div>
        </div>

        <${FeedbackWidget} sectionId="identity" feedback=${feedback} onUpdate=${onUpdate} />
      </div>
    </section>`;
}

function S3_Overview({ feedback, onUpdate }) {
  return html`
    <section id="overview" className="grad-cream-soft py-16 md:py-24 anim-in">

        <${SectionLabel} number="SECTION 03" title="Two-Tier Practice" accent="ink"

/* ─── Feedback Panel (sliding right) ────────────────── */

function FeedbackPanel({ open, onClose, feedback, onClear, onExport }) {
  if (!open) return null;
  const entries = Object.entries(feedback).filter(([, f]) => f && (f.status || f.note));

  return html`
    <div className="no-print fixed inset-0 z-50 flex" onClick=${onClose}>
      <div className="flex-1 bg-black/40 backdrop-blur-sm"></div>
      <div className="w-full max-w-md bg-white shadow-2xl panel-enter overflow-y-auto" onClick=${(e) => e.stopPropagation()}>
        <div className="sticky top-0 bg-white border-b border-stone-200 p-5 flex items-center justify-between">
          <div>
            <div className="font-mono text-xs uppercase tracking-widest text-stone-500 font-bold">Review Feedback</div>
            <div className="font-head text-xl font-extrabold">${entries.length} sections</div>
          </div>
          <button onClick=${onClose} className="rounded-full bg-stone-100 hover:bg-stone-200 w-9 h-9 flex items-center justify-center text-stone-600">✕</button>
        </div>

        ${entries.length === 0 ? html`
          <div className="p-8 text-center text-stone-400 font-thai">
            <div className="text-5xl mb-3">📝</div>
            ยังไม่มี feedback · เลื่อนอ่านแต่ละ section แล้วกด ✏️ Feedback
          </div>` : html`
          <div className="p-5 space-y-3">
            ${entries.map(([sid, f]) => {
              const sec = SECTIONS.find(s => s.id === sid);
              const status = STATUS_OPTIONS.find(s => s.id === f.status);
              return html`
                <div key=${sid} className="rounded-2xl border border-stone-200 p-4">
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <span className="font-mono text-xs text-stone-400">${sec?.num}</span>
                      <span className="font-head font-bold">${sec?.label}</span>
                    </div>
                    ${status && html`<span className=${"rounded-full px-2.5 py-0.5 text-[10px] font-bold " + status.color}>${status.label}</span>`}
                  </div>
                  ${f.note && html`<div className="text-sm font-thai text-stone-700 mt-2 leading-relaxed whitespace-pre-wrap">${f.note}</div>`}
                </div>`;
            })}
          </div>

          <div className="sticky bottom-0 bg-white border-t border-stone-200 p-5 space-y-2">
            <button onClick=${onExport}
              className="w-full rounded-2xl bg-rose-700 text-white py-3 font-bold text-sm hover:bg-rose-800 transition-colors">
              📥 Export Feedback (Markdown)
            </button>
            <button onClick=${onClear}
              className="w-full rounded-2xl bg-stone-100 text-stone-600 py-3 font-bold text-sm hover:bg-stone-200 transition-colors">
              🗑️ Clear All
            </button>
          </div>`}
      </div>
    </div>`;
}

/* ─── App ─────────────────────────────────────────── */

function App() {
  const [active, setActive] = useState("identity");
  const [feedback, setFeedback] = useState({});
  const [panelOpen, setPanelOpen] = useState(false);

  // Load feedback from localStorage
  useEffect(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) setFeedback(JSON.parse(saved));
    } catch {}
  }, []);

  // Save feedback to localStorage
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(feedback)); } catch {}
  }, [feedback]);

  // IntersectionObserver for active section
  useEffect(() => {
    const opts = { rootMargin: "-30% 0% -60% 0%", threshold: 0 };
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
    }, opts);
    SECTIONS.forEach((s) => {
      const el = document.getElementById(s.id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, []);

  const onJump = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  const onUpdate = (sectionId, data) => {
    setFeedback((p) => ({ ...p, [sectionId]: data }));
  };

  const onClear = () => {
    if (confirm("ลบ feedback ทั้งหมด?")) {
      setFeedback({});
      setPanelOpen(false);
    }
  };

  const onExport = () => {
    const entries = Object.entries(feedback).filter(([, f]) => f && (f.status || f.note));
    if (entries.length === 0) { alert("ยังไม่มี feedback"); return; }
    let md = "# UP Wellness Bible · Review Feedback\n\n";
    md += `Date: ${new Date().toLocaleString("th-TH")}\n\n`;
    md += `Total sections with feedback: ${entries.length}\n\n---\n\n`;
    entries.forEach(([sid, f]) => {
      const sec = SECTIONS.find(s => s.id === sid);
      const status = STATUS_OPTIONS.find(s => s.id === f.status);
      md += `## ${sec?.num} · ${sec?.label}\n\n`;
      if (status) md += `**Status:** ${status.label}\n\n`;
      if (f.note) md += `**Note:**\n${f.note}\n\n`;
      md += "---\n\n";
    });
    const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `UP-Wellness-Bible-Feedback-${new Date().toISOString().slice(0,10)}.md`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const feedbackCount = Object.values(feedback).filter(f => f && (f.status || f.note)).length;

  return html`
    <div className="min-h-screen">
      <${Hero} feedbackCount=${feedbackCount} />
      <${StickyNav} active=${active} onJump=${onJump} feedback=${feedback} onOpenPanel=${() => setPanelOpen(true)} />
      <${S1_Identity} feedback=${feedback} onUpdate=${onUpdate} />
      <${S2_Voice} feedback=${feedback} onUpdate=${onUpdate} />
      <${S3_Overview} feedback=${feedback} onUpdate=${onUpdate} />
      <${S4_UPLabs} feedback=${feedback} onUpdate=${onUpdate} />
      <${S5_FullCourse} feedback=${feedback} onUpdate=${onUpdate} />
      <${S6_Decision} feedback=${feedback} onUpdate=${onUpdate} />
      <${S7_Sales} feedback=${feedback} onUpdate=${onUpdate} />
      <${S8_Products} feedback=${feedback} onUpdate=${onUpdate} />
      <${S9_Clinical} feedback=${feedback} onUpdate=${onUpdate} />
      <${S10_Ladder} feedback=${feedback} onUpdate=${onUpdate} />
      <${S11_Ops} feedback=${feedback} onUpdate=${onUpdate} />

      <footer className="bg-stone-900 text-stone-300 py-12">
        <div className="mx-auto max-w-6xl px-6 text-center">
          <div className="font-head text-xl font-extrabold text-white">UP Wellness · Knowledge Bible</div>
          <div className="mt-2 font-thai text-sm">v1 · 16 พ.ค. 2569 · Living Document</div>
          <div className="mt-1 text-xs text-stone-400">Cross-ref: BRAND.md · CLAUDE.md · 06_Product-Knowledge/nutrilite_thailand_catalog.xlsx</div>
        </div>
      </footer>

      <${FeedbackPanel} open=${panelOpen} onClose=${() => setPanelOpen(false)}
        feedback=${feedback} onClear=${onClear} onExport=${onExport} />
    </div>`;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(html`<${App} />`);
</script>

</body>
