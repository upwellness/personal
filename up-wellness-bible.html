<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UP Wellness · Knowledge Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --rose: #8C4C4C; --rose-deep: #6B3535; --rose-soft: #F4E6E6; --rose-ultra: #FAF3F2;
    --green: #396755; --green-deep: #2A4F40; --green-soft: #E6EFEA;
    --amber: #B8860B; --amber-deep: #8B6608; --amber-soft: #FEF3C7;
    --paper: #FBF8F3;  /* cream paper base */
    --paper-deep: #F0EBE0;
    --ink: #1A1714;
    --ink-60: #6E6963;
    --ink-30: #B5AFA5;
    --line: #E5DFD2;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .font-serif { font-family: 'Cormorant Garamond', 'Sarabun', serif; letter-spacing: -0.005em; }
  .font-sans  { font-family: 'Inter', sans-serif; letter-spacing: -0.01em; }
  .font-thai  { font-family: 'Sarabun', sans-serif; }
  .font-mono  { font-family: 'JetBrains Mono', monospace; }

  /* Smooth a11y */
  button, a, [role="button"] { transition: all 220ms ease; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 2px; }

  /* Drop-cap on first paragraph of chapter */
  .drop-cap::first-letter {
    font-family: 'Cormorant Garamond', serif;
    font-size: 4.5rem;
    line-height: 0.85;
    float: left;
    margin: 0.15rem 0.5rem -0.1rem 0;
    color: var(--rose);
    font-weight: 600;
  }

  /* Pull quote */
  .pullquote {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.7rem;
    line-height: 1.4;
    color: var(--rose-deep);
    border-left: 3px solid var(--rose);
    padding-left: 1.5rem;
  }

  /* Section divider · ornament */
  .ornament {
    display: flex; align-items: center; gap: 1rem;
    color: var(--ink-30);
  }
  .ornament::before, .ornament::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }

  /* Side rail · book spine feel */
  .side-rail {
    border-right: 1px solid var(--line);
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.5) 100%);
  }
  .side-rail::-webkit-scrollbar { width: 4px; }
  .side-rail::-webkit-scrollbar-thumb { background: var(--ink-30); border-radius: 2px; }

  /* Chapter number · roman numeral feel */
  .chapter-num {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-feature-settings: "lnum";
  }

  /* Status pills */
  .pill-ok       { background: #DCFCE7; color: #166534; }
  .pill-revise   { background: var(--amber-soft); color: var(--amber-deep); }
  .pill-unclear  { background: #DBEAFE; color: #1E40AF; }
  .pill-wrong    { background: #FEE2E2; color: #B91C1C; }
  .pill-neutral  { background: var(--paper-deep); color: var(--ink-60); }

  /* Card · paper feel */
  .paper-card {
    background: white;
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 var(--paper-deep), 0 2px 8px -3px rgba(26,23,20,0.05);
  }

  /* Panel slide */
  .panel-enter { animation: slide-in 0.3s ease-out; }
  @keyframes slide-in {
    from { transform: translateX(100%); }
    to   { transform: translateX(0); }
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .anim-in { animation: fade-up 0.5s ease-out backwards; }
  @media (prefers-reduced-motion: reduce) {
    .anim-in, .panel-enter { animation: none; }
    * { transition: none !important; }
  }

  @media print {
    .no-print { display: none !important; }
    body { background: white; font-size: 12px; }
    section { break-inside: avoid; }
  }
</style>
</head>
<body>
<div id="root">
  <div style="padding: 80px 24px; max-width: 600px; margin: 0 auto; text-align: center;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8C4C4C; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;">UP Wellness</div>
    <div style="margin-top: 16px; font-family: 'Cormorant Garamond', serif; font-size: 36px; font-style: italic; color: #1A1714;">Knowledge Bible</div>
    <div style="margin-top: 8px; font-family: 'Sarabun', sans-serif; font-size: 14px; color: #6E6963;">กำลังเปิดเล่ม...</div>
    <div id="error-pane" style="margin-top: 24px; padding: 16px; background: #FEE2E2; color: #991B1B; border-radius: 8px; font-family: monospace; font-size: 13px; text-align: left; white-space: pre-wrap; display: none;"></div>
  </div>
</div>

<script>
window.addEventListener("error", function(e) {
  var p = document.getElementById("error-pane");
  if (p) { p.style.display = "block"; p.textContent = "Error: " + e.message + "\nLine: " + e.lineno; }
});
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>

<script>
const { useState, useEffect, useMemo } = React;
const html = htm.bind(React.createElement);

const STORAGE_KEY = "up-wellness-bible-feedback-v2";

const CHAPTERS = [
  { id: "identity",   roman: "I",    num: "01", title: "Identity",        thai: "ตัวตน · พันธกิจ" },
  { id: "voice",      roman: "II",   num: "02", title: "Voice",           thai: "บุคลิก · เสียง" },
  { id: "overview",   roman: "III",  num: "03", title: "Two Tiers",       thai: "สองคอร์ส" },
  { id: "uplabs",     roman: "IV",   num: "04", title: "UP Labs",         thai: "Longevity 14 วัน" },
  { id: "fullcourse", roman: "V",    num: "05", title: "Full Course",     thai: "Anti-aging 60 วัน" },
  { id: "decision",   roman: "VI",   num: "06", title: "Decision",        thai: "การเลือกคอร์ส" },
  { id: "sales",      roman: "VII",  num: "07", title: "Sales",           thai: "Funnel · Marketing" },
  { id: "products",   roman: "VIII", num: "08", title: "Products",        thai: "Nutrilite TH catalog" },
  { id: "clinical",   roman: "IX",   num: "09", title: "Clinical",        thai: "ความปลอดภัย" },
  { id: "ladder",     roman: "X",    num: "10", title: "Pricing",         thai: "Service ladder" },
  { id: "ops",        roman: "XI",   num: "11", title: "Operating",       thai: "มาตรฐานปฏิบัติ" },
];

const STATUS_OPTIONS = [
  { id: "ok",      label: "✓ ถูกต้อง",   color: "pill-ok" },
  { id: "revise",  label: "✏️ ปรับปรุง", color: "pill-revise" },
  { id: "unclear", label: "❓ ไม่ชัด",    color: "pill-unclear" },
  { id: "wrong",   label: "🚨 ผิด",      color: "pill-wrong" },
];

/* ─── Components ─────────────────────────────── */

function Cover({ feedbackCount }) {
  return html`
    <section className="relative overflow-hidden" style=${{ background: "linear-gradient(180deg, #FBF8F3 0%, #F0EBE0 100%)" }}>
      <div className="mx-auto max-w-7xl px-6 md:px-12 py-20 md:py-32">
        <div className="grid md:grid-cols-12 gap-12 items-end">
          <div className="md:col-span-7">
            <div className="font-mono text-[11px] uppercase tracking-[0.3em] text-stone-500 mb-8">UP Wellness · Knowledge Bible</div>
            <h1 className="font-serif text-6xl md:text-8xl leading-[0.95] text-stone-900 mb-6" style=${{ letterSpacing: "-0.02em" }}>
              The <span className="italic" style=${{ color: "var(--rose)" }}>Knowledge</span><br/>
              of <span className="italic" style=${{ color: "var(--green)" }}>UP Wellness</span>
            </h1>
            <p className="font-serif italic text-2xl md:text-3xl text-stone-700 mt-6 leading-snug">
              "Anti-aging program ที่ลดน้ำหนักเป็นของแถม<br/>
              ผ่านวิทยาศาสตร์ · ไม่ผ่านการขาย"
            </p>
            <div className="mt-12 flex flex-wrap items-center gap-x-8 gap-y-3 text-sm font-thai text-stone-600">
              <div className="flex items-center gap-2">
                <span className="font-mono text-xs uppercase tracking-widest text-stone-400">Version</span>
                <span className="font-serif font-medium">II · ปรับปรุง</span>
              </div>
              <div className="h-3 w-px bg-stone-300"></div>
              <div className="flex items-center gap-2">
                <span className="font-mono text-xs uppercase tracking-widest text-stone-400">Verified</span>
                <span className="font-serif font-medium">17 พฤษภาคม 2569</span>
              </div>
              ${feedbackCount > 0 && html`
                <div className="h-3 w-px bg-stone-300"></div>
                <div className="flex items-center gap-2">
                  <span className="font-mono text-xs uppercase tracking-widest" style=${{ color: "var(--rose)" }}>Feedback</span>
                  <span className="font-serif font-medium" style=${{ color: "var(--rose)" }}>${feedbackCount} marked</span>
                </div>`}
            </div>
          </div>

          <div className="md:col-span-5">
            <div className="paper-card rounded-sm p-8">
              <div className="font-mono text-[10px] uppercase tracking-[0.25em] text-stone-400 mb-4">Table of Contents</div>
              <ol className="space-y-2.5">
                ${CHAPTERS.slice(0, 6).map((c) => html`
                  <li key=${c.id} className="flex items-baseline gap-3 text-stone-700">
                    <span className="chapter-num text-stone-400 w-6 text-sm">${c.roman}</span>
                    <a href=${"#" + c.id} className="font-serif text-base flex-1 hover:text-rose-700 transition-colors">${c.title}</a>
                    <span className="font-mono text-[10px] text-stone-300">${c.num}</span>
                  </li>`)}
              </ol>
              <div className="ornament my-4"><span className="text-xs">⊹</span></div>
              <ol className="space-y-2.5">
                ${CHAPTERS.slice(6).map((c) => html`
                  <li key=${c.id} className="flex items-baseline gap-3 text-stone-700">
                    <span className="chapter-num text-stone-400 w-6 text-sm">${c.roman}</span>
                    <a href=${"#" + c.id} className="font-serif text-base flex-1 hover:text-rose-700 transition-colors">${c.title}</a>
                    <span className="font-mono text-[10px] text-stone-300">${c.num}</span>
                  </li>`)}
              </ol>
            </div>
          </div>
        </div>
      </div>
    </section>`;
}

function ChapterHead({ chapter }) {
  return html`
    <header className="text-center mb-12 anim-in">
      <div className="ornament mb-6"><span className="chapter-num text-2xl text-stone-400">${chapter.roman}</span></div>
      <div className="font-mono text-[11px] uppercase tracking-[0.3em] text-stone-400 mb-3">Chapter ${chapter.num}</div>
      <h2 className="font-serif text-5xl md:text-6xl text-stone-900 mb-3" style=${{ letterSpacing: "-0.02em" }}>${chapter.title}</h2>
      <p className="font-thai text-lg text-stone-600">${chapter.thai}</p>
      <div className="ornament mt-6"><span className="text-stone-300">⊹</span></div>
    </header>`;
}

function StickyNav({ active, onJump, feedback, onOpenPanel, panelOpen }) {
  return html`
    <nav className="no-print sticky top-0 z-30 bg-stone-50/85 backdrop-blur-md border-b" style=${{ borderColor: "var(--line)" }}>
      <div className="mx-auto max-w-7xl px-4 md:px-6 py-2.5 flex items-center gap-3">
        <a href="#cover" className="font-serif italic text-lg text-stone-900 mr-2">Bible</a>
        <div className="flex-1 overflow-x-auto flex items-center gap-1 no-scrollbar">
          ${CHAPTERS.map((c) => {
            const hasFb = feedback[c.id] && (feedback[c.id].status || feedback[c.id].note);
            const isActive = active === c.id;
            return html`
              <button key=${c.id} onClick=${() => onJump(c.id)}
                className=${"shrink-0 rounded-sm px-3 py-1.5 text-xs font-mono uppercase tracking-wider " +
                  (isActive ? "bg-stone-900 text-white" : "text-stone-500 hover:bg-stone-100")}>
                ${c.num}
                ${hasFb && html`<span className="ml-1 inline-block h-1.5 w-1.5 rounded-full" style=${{ background: "var(--rose)" }}></span>`}
              </button>`;
          })}
        </div>
        <button onClick=${onOpenPanel}
          className=${"shrink-0 rounded-sm px-3 py-1.5 text-xs font-mono uppercase tracking-wider font-bold " +
            (panelOpen ? "bg-rose-700 text-white" : "border hover:bg-stone-100")}
          style=${panelOpen ? {} : { borderColor: "var(--rose)", color: "var(--rose)" }}>
          Marginalia · ${Object.values(feedback).filter(f => f.status || f.note).length}
        </button>
      </div>
    </nav>`;
}

function FeedbackWidget({ chapterId, feedback, onUpdate }) {
  const [open, setOpen] = useState(false);
  const current = feedback[chapterId] || {};

  const setStatus = (status) => onUpdate(chapterId, { ...current, status });
  const setNote = (note) => onUpdate(chapterId, { ...current, note });

  const hasContent = current.status || current.note;
  const pillClass = current.status ? STATUS_OPTIONS.find(s => s.id === current.status)?.color : "pill-neutral";

  return html`
    <div className="no-print mt-10 rounded-sm border-l-2 pl-5 pr-4 py-3" style=${{ borderColor: "var(--rose)", background: "rgba(140,76,76,0.025)" }}>
      <button onClick=${() => setOpen(!open)} className="w-full flex items-center justify-between gap-3 text-left">
        <div className="flex items-center gap-3">
          <span className="font-mono text-[10px] uppercase tracking-[0.2em] text-stone-500 font-bold">Marginalia · feedback</span>
          ${hasContent && html`
            <span className=${"rounded-sm px-2 py-0.5 text-[10px] font-mono " + pillClass}>
              ${current.status ? STATUS_OPTIONS.find(s => s.id === current.status)?.label : "noted"}
            </span>`}
        </div>
        <span className="text-stone-400 font-mono text-xs">${open ? "−" : "+"}</span>
      </button>

      ${open && html`
        <div className="mt-4 space-y-3 pb-2">
          <div className="flex flex-wrap gap-2">
            ${STATUS_OPTIONS.map((s) => html`
              <button key=${s.id} onClick=${() => setStatus(current.status === s.id ? null : s.id)}
                className=${"rounded-sm px-3 py-1.5 text-xs font-mono " +
                  (current.status === s.id ? s.color + " font-bold" : "border hover:bg-stone-100 text-stone-500")}
                style=${current.status === s.id ? {} : { borderColor: "var(--line)" }}>
                ${s.label}
              </button>`)}
          </div>
          <textarea value=${current.note || ""} onChange=${(e) => setNote(e.target.value)}
            placeholder="คอมเมนต์ · ที่อยากแก้ · ที่ขัด · ข้อมูลเพิ่ม..."
            rows="3"
            className="w-full rounded-sm border px-3 py-2.5 text-sm font-thai placeholder:text-stone-400 focus:outline-none focus:border-stone-900"
            style=${{ borderColor: "var(--line)", background: "white" }}
          />
        </div>`}
    </div>`;
}

/* ─── Chapters ────────────────────────────────── */

function Ch1_Identity({ feedback, onUpdate }) {
  return html`
    <section id="identity" className="py-20 md:py-28">
      <div className="mx-auto max-w-3xl px-6">
        <${ChapterHead} chapter=${CHAPTERS[0]} />
        <p className="drop-cap font-thai text-lg leading-[1.85] text-stone-800 mb-8">
          UP Wellness คือ <strong>ที่ปรึกษาสุขภาพมืออาชีพ</strong> ที่ทำธุรกิจ Amway/Nutrilite อย่างมืออาชีพ · ไม่ใช่ chatbot ขายของ · ไม่ใช่ Amway ทั่วไป · เป็นที่ปรึกษาก่อน นักขายทีหลัง
        </p>

        <div className="pullquote mb-12">
          ที่ปรึกษาสุขภาพก่อน · นักขายทีหลัง<br/>
          ให้ความรู้ก่อน · ทำให้อยากซื้อทีหลัง
        </div>

        <h3 className="font-serif text-3xl text-stone-900 mt-12 mb-6">Mission · พันธกิจ 4 ข้อ</h3>
        <ol className="space-y-4">
          ${[
            "ให้ข้อมูลสุขภาพถูกต้อง อ้างอิงงานวิจัย ไม่มั่ว ไม่เดา",
            "ออกแบบแนวทาง weight loss / longevity เฉพาะบุคคล",
            "สร้างความน่าเชื่อถือในฐานะผู้เชี่ยวชาญ ไม่ใช่นักขาย",
            "แนะนำ Nutrilite / Partner Program อย่างเนียน ในบริบทเหมาะสม",
          ].map((m, i) => html`
            <li key=${i} className="flex gap-4 font-thai text-base text-stone-700">
              <span className="font-serif text-2xl shrink-0 w-8" style=${{ color: "var(--rose)" }}>${String(i + 1).padStart(2, "0")}</span>
              <span>${m}</span>
            </li>`)}
        </ol>

        <h3 className="font-serif text-3xl text-stone-900 mt-16 mb-6">Positioning · ที่ต่างจาก Amway ทั่วไป</h3>
        <div className="grid md:grid-cols-2 gap-px paper-card rounded-sm overflow-hidden">
          <div className="p-6 bg-stone-50">
            <div className="font-mono text-[10px] uppercase tracking-[0.2em] text-stone-400 mb-3">Amway ทั่วไป</div>
            <ul className="space-y-2 font-thai text-stone-600">
              <li>· ขายของก่อน</li>
              <li>· Testimonial เดี่ยวๆ</li>
              <li>· Close deal ระยะสั้น</li>
              <li>· ทำให้อยากซื้อก่อน</li>
            </ul>
          </div>
          <div className="p-6" style=${{ background: "var(--rose-ultra)" }}>
            <div className="font-mono text-[10px] uppercase tracking-[0.2em] font-bold mb-3" style=${{ color: "var(--rose)" }}>UP Wellness</div>
            <ul className="space-y-2 font-thai text-stone-800 font-semibold">
              <li>· ที่ปรึกษาก่อน · ขายทีหลัง</li>
              <li>· Evidence-based · peer-reviewed</li>
              <li>· Trust ระยะยาว</li>
              <li>· ให้ความรู้ก่อน</li>
            </ul>
          </div>
        </div>

        <${FeedbackWidget} chapterId="identity" feedback=${feedback} onUpdate=${onUpdate} />
      </div>
    </section>`;
}

function Ch2_Voice({ feedback, onUpdate }) {
  return html`
    <section id="voice" className="py-20 md:py-28" style=${{ background: "white" }}>
      <div className="mx-auto max-w-3xl px-6">
        <${ChapterHead} chapter=${CHAPTERS[1]} />
        <p className="drop-cap font-thai text-lg leading-[1.85] text-stone-800 mb-8">
          DISC ของ UP Wellness = <strong>C + S</strong> (Conscientious + Steady) · ผู้เชี่ยวชาญที่ละเอียดรอบคอบ · ใจเย็น · ฟังก่อนแนะนำ · พูดเหมือนหมอที่เป็นเพื่อน · มีความรู้แต่ไม่ทางการจนเกิน
        </p>

        <div className="grid md:grid-cols-3 gap-px paper-card rounded-sm overflow-hidden mb-12">
          ${[
            { roman: "I",   name: "The Sage",      desc: "รู้จริง · ให้ความรู้ · น่าเชื่อถือ", color: "var(--amber)" },
            { roman: "II",  name: "The Everyman",  desc: "พูดง่าย · เข้าถึง · จริงใจ", color: "var(--rose)" },
            { roman: "III", name: "The Caregiver", desc: "ใส่ใจ · ไม่ทำให้รู้สึกโง่", color: "var(--green)" },
          ].map((a, i) => html`
            <div key=${i} className="p-6 bg-white">
              <div className="chapter-num text-xl mb-2" style=${{ color: a.color }}>${a.roman}</div>
              <div className="font-serif text-xl text-stone-900 mb-1">${a.name}</div>
              <div className="font-thai text-sm text-stone-600">${a.desc}</div>
            </div>`)}
        </div>

        <h3 className="font-serif text-3xl text-stone-900 mt-12 mb-6">เสียงคู่ · Two Voices</h3>
        <div className="space-y-px paper-card rounded-sm overflow-hidden">
          <div className="p-6 bg-stone-50">
            <div className="flex items-baseline gap-3 mb-4">
              <span className="font-serif italic text-3xl text-stone-900">ตัน</span>
              <span className="font-mono text-[10px] uppercase tracking-widest text-stone-400">Owner Voice</span>
            </div>
            <ul className="space-y-1.5 font-thai text-sm text-stone-700">

function App() {
  const [active, setActive] = useState("identity");
  const [feedback, setFeedback] = useState({});
  const [panelOpen, setPanelOpen] = useState(false);

  useEffect(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) setFeedback(JSON.parse(saved));
    } catch {}
  }, []);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(feedback)); } catch {}
  }, [feedback]);

  useEffect(() => {
    const opts = { rootMargin: "-30% 0% -60% 0%", threshold: 0 };
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
    }, opts);
    CHAPTERS.forEach((c) => {
      const el = document.getElementById(c.id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, []);

  const onJump = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const onUpdate = (cid, data) => setFeedback((p) => ({ ...p, [cid]: data }));
  const onClear = () => {
    if (confirm("ลบ marginalia ทั้งหมด?")) { setFeedback({}); setPanelOpen(false); }
  };
  const onExport = () => {
    const entries = Object.entries(feedback).filter(([, f]) => f && (f.status || f.note));
    if (entries.length === 0) { alert("ยังไม่มี marginalia"); return; }
    let md = "# UP Wellness Bible · Marginalia\n\n";
    md += `Date: ${new Date().toLocaleString("th-TH")}\n\n`;
    md += `Total notes: ${entries.length}\n\n---\n\n`;
    entries.forEach(([cid, f]) => {
      const ch = CHAPTERS.find(c => c.id === cid);
      const status = STATUS_OPTIONS.find(s => s.id === f.status);
      md += `## ${ch?.num} · ${ch?.title}\n\n`;
      if (status) md += `**Status:** ${status.label}\n\n`;
      if (f.note) md += `**Note:**\n${f.note}\n\n`;
      md += "---\n\n";
    });
    const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `UP-Wellness-Bible-Marginalia-${new Date().toISOString().slice(0,10)}.md`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const feedbackCount = Object.values(feedback).filter(f => f && (f.status || f.note)).length;

  return html`
    <div className="min-h-screen">
      <div id="cover"><${Cover} feedbackCount=${feedbackCount} /></div>
      <${StickyNav} active=${active} onJump=${onJump} feedback=${feedback} onOpenPanel=${() => setPanelOpen(true)} panelOpen=${panelOpen} />
      <${Ch1_Identity}   feedback=${feedback} onUpdate=${onUpdate} />
      <${Ch2_Voice}      feedback=${feedback} onUpdate=${onUpdate} />
      <${Ch3_Overview}   feedback=${feedback} onUpdate=${onUpdate} />
      <${Ch4_UPLabs}     feedback=${feedback} onUpdate=${onUpdate} />
      <${Ch5_FullCourse} feedback=${feedback} onUpdate=${onUpdate} />
      <${Ch6_Decision}   feedback=${feedback} onUpdate=${onUpdate} />
      <${Ch7_Sales}      feedback=${feedback} onUpdate=${onUpdate} />
      <${Ch8_Products}   feedback=${feedback} onUpdate=${onUpdate} />
      <${Ch9_Clinical}   feedback=${feedback} onUpdate=${onUpdate} />
      <${Ch10_Ladder}    feedback=${feedback} onUpdate=${onUpdate} />
      <${Ch11_Ops}       feedback=${feedback} onUpdate=${onUpdate} />

      <footer className="py-12 border-t" style=${{ borderColor: "var(--line)", background: "var(--paper-deep)" }}>
        <div className="mx-auto max-w-3xl px-6 text-center">
          <div className="ornament mb-4"><span className="text-stone-400 text-xl">⊹</span></div>
          <div className="font-serif italic text-2xl text-stone-700">UP Wellness · Knowledge Bible</div>
          <div className="mt-3 font-mono text-xs uppercase tracking-widest text-stone-500">Version II · 17 พ.ค. 2569</div>
          <div className="mt-1 font-thai text-xs text-stone-500">Living document · ปรับปรุงเมื่อ catalog เปลี่ยน · protocol ใหม่ · feedback rounds</div>
        </div>
      </footer>

      <${FeedbackPanel} open=${panelOpen} onClose=${() => setPanelOpen(false)} feedback=${feedback} onClear=${onClear} onExport=${onExport} />
    </div>`;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(html`<${App} />`);
</script>

</body>
</html>
