// Slug helper for per-product deep links
function slugify(name) {
  return name.toLowerCase()
    .replace(/[()]/g, '')
    .replace(/[^a-z0-9\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .slice(0, 40);
}

// Build share message in UP Wellness voice
function buildShareMessage(p, baseUrl) {
  const slug = slugify(p.name);
  const url  = `${baseUrl}#${slug}`;
  return [
    `🌿 Nutrilite ${p.name}`,
    `(${p.name_th})`,
    '',
    `💬 "${p.opener}"`,
    '',
    `📋 ${p.benefits}`,
    `🎯 ${p.target}`,
    '',
    `💰 ฿${p.price.toLocaleString()} · ${p.sku}`,
    `👉 ${url}`,
  ].join('\n');
}

function App() {

  const [expandedId, setExpandedId] = useState(null);
  const [toast, setToast] = useState('');

  // Base URL (without hash) — for sharing
  const baseUrl = useMemo(() => {
    if (typeof window === 'undefined') return '';
    return window.location.origin + window.location.pathname;
  }, []);

  // Deep link · resolve #slug on initial load
  useEffect(() => {
    const hash = window.location.hash.replace('#', '');
    if (!hash) return;
    const idx = PRODUCTS.findIndex(p => slugify(p.name) === hash);
    if (idx >= 0) {
      setExpandedId(idx);
      setTimeout(() => {
        const el = document.getElementById(`product-${idx}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
    }
  }, []);

  const filtered = useMemo(() => {
    return PRODUCTS.filter(p => {
      if (cat !== 'all' && p.cat !== cat) return false;
      if (search.trim()) {
        const s = search.toLowerCase();
        return (
          p.name.toLowerCase().includes(s) ||
          p.name_th.toLowerCase().includes(s) ||
          p.target.toLowerCase().includes(s) ||
          p.benefits.toLowerCase().includes(s)
        );

      return true;

  const catCounts = useMemo(() => {

    const url = `${baseUrl}#${slugify(product.name)}`;

    setTimeout(() => setToast(''), 2000);

  const shareLine = (product) => {

    window.open(lineUrl, '_blank', 'noopener,noreferrer');

    const msg = buildShareMessage(product, baseUrl);
    if (navigator.share) {

        await navigator.share({
          title: `Nutrilite ${product.name}`,
          text:  msg,

const root = createRoot(document.getElementById('root'));
root.render(html`<${App} />`);
