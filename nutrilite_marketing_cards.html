  {
    name: 'Clear Complex',
    name_th: 'นิวทริไลท์ ไคลร์ คอมเพล็กซ์',
    cat: 'adaptogen',
    price: null,
    sku: '102735',
    desc: 'Cinnamon extract + picao preto powder + acerola · 180 เม็ด',
    benefits: 'ดูแลทางเดินหายใจ · ลดอาการแพ้/ภูมิแพ้ · ภูมิคุ้มกัน · ‘กองพลพิเศษ’ ป้องกันไวรัส',
    target: 'คนแพ้อากาศ · ภูมิแพ้เรื้อรัง · จาม คัดจมูก · ป่วยง่ายตอนเปลี่ยนฤดู',
    opener: 'ช่วงเปลี่ยนฤดู จาม คัดจมูก ภูมิแพ้กำเริบใช่ไหม',
  },
  {
    name: 'Herbal Mix',
    name_th: 'นิวทริไลท์ เฮอร์บัล มิกซ์',
    cat: 'adaptogen',
    price: null,
    sku: '300475TH',
    desc: 'Licorice extract + turmeric extract + acerola cherry juice powder · Vit C + Zinc',
    benefits: 'เสริมภูมิคุ้มกัน · ต้านอนุมูลอิสระ · ขมิ้นชันลดการอักเสบ · ชะเอมบำรุงระบบทางเดินอาหาร',
    target: 'คนป่วยบ่อย · ภูมิตก · สาย herbal natural · ดูแลแบบองค์รวม',
    opener: 'ช่วงนี้ป่วยบ่อยไหม รู้สึกร่างกายไม่แข็งแรงเหมือนเดิมหรือเปล่า',
  },
];

/* ═══════════════════════════════════════════════════════════════ */
/* APP                                                                */
/* ═══════════════════════════════════════════════════════════════ */

function App() {
  const [search, setSearch] = useState('');
  const [cat, setCat] = useState('all');
  const [view, setView] = useState('grid'); // grid | list
  const [expandedId, setExpandedId] = useState(null);
  const [toast, setToast] = useState('');

  const filtered = useMemo(() => {
    return PRODUCTS.filter(p => {
      if (cat !== 'all' && p.cat !== cat) return false;
      if (search.trim()) {
        const s = search.toLowerCase();
        const catLabel = (CATEGORIES[p.cat]?.label || '').toLowerCase();
        return (
          p.name.toLowerCase().includes(s) ||
          p.name_th.toLowerCase().includes(s) ||
          p.target.toLowerCase().includes(s) ||
          p.benefits.toLowerCase().includes(s) ||
          (p.desc || '').toLowerCase().includes(s) ||
          (p.sku || '').toLowerCase().includes(s) ||
          (p.opener || '').toLowerCase().includes(s) ||
          catLabel.includes(s)
        );
      }
      return true;
    });
  }, [search, cat]);

  const priceRange = useMemo(() => {
    const prices = PRODUCTS.filter(p => p.price && p.price > 0).map(p => p.price);
    if (prices.length === 0) return '—';
    const min = Math.min(...prices);
    const max = Math.max(...prices);
    return `฿${min.toLocaleString()} – ฿${max.toLocaleString()}`;
  }, []);

  const catCounts = useMemo(() => {
    const c = { all: PRODUCTS.length };
    Object.keys(CATEGORIES).forEach(k => { c[k] = PRODUCTS.filter(p => p.cat === k).length; });
    return c;
  }, []);

  const copy = (text) => {
    navigator.clipboard.writeText(text);
    setToast('คัดลอกแล้ว ✓');
    setTimeout(() => setToast(''), 2000);
  };

  return html`
    <div className="min-h-screen px-4 py-8 md:px-8 md:py-12">

      <!-- ── Header ── -->
      <header className="max-w-7xl mx-auto mb-10">
        <div className="glass glass-shine rounded-3xl px-6 py-8 md:px-10 md:py-10">
          <div className="font-mono text-[11px] tracking-[0.2em] uppercase text-rose-deep mb-3">
            UP Wellness · Marketing Cards · ${new Date().toLocaleDateString('th-TH')}
          </div>
          <h1 className="font-display text-4xl md:text-5xl font-semibold text-ink mb-3 tracking-tight">
            Nutrilite <em className="text-rose italic font-medium">Product Library</em>
          </h1>
          <p className="text-ink-60 text-base max-w-3xl leading-relaxed">
            ${PRODUCTS.length} สินค้า · รายละเอียด · สรรพคุณ · target · ประโยคเปิดใจสำหรับใช้คุยกับลูกค้า
            <br/>คลิกที่การ์ดเพื่อดู marketing opener · กดปุ่ม Copy เพื่อใช้ทันที
          </p>

          <!-- ── Stats ── -->
          <div className="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3">
            <div className="glass-rose rounded-2xl px-4 py-3">
              <div className="font-mono text-[9px] tracking-widest uppercase text-rose-deep">Total SKUs</div>
              <div className="font-display text-2xl font-bold text-ink mt-1">${PRODUCTS.length}</div>
            </div>
            <div className="glass-rose rounded-2xl px-4 py-3">
              <div className="font-mono text-[9px] tracking-widest uppercase text-rose-deep">Categories</div>
              <div className="font-display text-2xl font-bold text-ink mt-1">${Object.keys(CATEGORIES).length}</div>
            </div>
            <div className="glass-rose rounded-2xl px-4 py-3">
              <div className="font-mono text-[9px] tracking-widest uppercase text-rose-deep">Price Range</div>
              <div className="font-display text-xl font-bold text-ink mt-1">${priceRange}</div>
            </div>
            <div className="glass-rose rounded-2xl px-4 py-3">
              <div className="font-mono text-[9px] tracking-widest uppercase text-rose-deep">Showing</div>
              <div className="font-display text-2xl font-bold text-ink mt-1">${filtered.length} <span className="text-sm text-ink-40">/ ${PRODUCTS.length}</span></div>
            </div>
          </div>
        </div>
      </header>

      <!-- ── Filter bar ── -->
      <div className="max-w-7xl mx-auto mb-6 no-print">
        <div className="glass rounded-2xl px-4 py-3 flex flex-col md:flex-row gap-3 items-stretch md:items-center">
          <!-- Search -->
          <div className="flex-1 relative">
            <input
              type="text"
              value=${search}
              onChange=${(e) => setSearch(e.target.value)}
              placeholder="ค้นหา · ชื่อ · SKU · target · สรรพคุณ · category..."
              className="w-full px-4 py-2.5 pl-10 bg-white/40 border border-white/60 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose/30 focus:bg-white/70 transition"
            />
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-40 pointer-events-none">🔍</span>
            ${search && html`
              <button onClick=${() => setSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-ink-40 hover:text-rose text-sm">✕</button>
            `}
          </div>

          <!-- View toggle -->
          <div className="flex gap-1 bg-white/40 rounded-xl p-1">
            <button
              onClick=${() => setView('grid')}
              className=${`px-3 py-1.5 rounded-lg text-sm font-medium transition ${view === 'grid' ? 'bg-ink text-cream' : 'text-ink-60 hover:text-ink'}`}
            >▦ Grid</button>
            <button
              onClick=${() => setView('list')}
              className=${`px-3 py-1.5 rounded-lg text-sm font-medium transition ${view === 'list' ? 'bg-ink text-cream' : 'text-ink-60 hover:text-ink'}`}
            >☰ List</button>
          </div>
        </div>

        <!-- Category pills -->
        <div className="mt-3 flex flex-wrap gap-2">
          <button
            onClick=${() => setCat('all')}
            className=${`px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide transition border ${cat === 'all' ? 'bg-ink text-cream border-ink' : 'glass border-white/60 text-ink-60 hover:text-ink'}`}
          >
            ทั้งหมด <span className="ml-1 font-mono opacity-60">${catCounts.all}</span>
          </button>
          ${Object.entries(CATEGORIES).map(([key, c]) => html`
            <button
              key=${key}
              onClick=${() => setCat(key)}
              className=${`px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide transition border flex items-center gap-2 ${cat === key ? 'text-white border-transparent' : 'glass border-white/60 text-ink-60 hover:text-ink'}`}
              style=${cat === key ? { background: c.color } : {}}
            >
              <span className="cat-dot" style=${{ background: c.color, color: c.color }}></span>
              ${c.label} <span className="font-mono opacity-60">${catCounts[key] || 0}</span>
            </button>
          `)}
        </div>
      </div>

      <!-- ── Cards ── -->
      <div className="max-w-7xl mx-auto">
        ${view === 'grid' ? html`
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${filtered.map((p, i) => html`<${ProductCard} key=${i} product=${p} expanded=${expandedId === i} onToggle=${() => setExpandedId(expandedId === i ? null : i)} onCopy=${copy} />`)}
          </div>
        ` : html`
          <div className="space-y-3">
            ${filtered.map((p, i) => html`<${ProductRow} key=${i} product=${p} expanded=${expandedId === i} onToggle=${() => setExpandedId(expandedId === i ? null : i)} onCopy=${copy} />`)}
          </div>
        `}

        ${filtered.length === 0 && html`
          <div className="glass rounded-3xl p-12 text-center">
            <div className="text-4xl">🔍</div>
            <p className="mt-3 text-ink-60">ไม่พบสินค้าตามเงื่อนไข</p>
            <button onClick=${() => { setSearch(''); setCat('all'); }} className="mt-3 text-rose text-sm font-semibold hover:underline">↺ ล้างตัวกรอง</button>
          </div>
        `}
      </div>

      <!-- ── Footer ── -->
      <footer className="max-w-7xl mx-auto mt-12 text-center text-ink-40 text-xs font-mono tracking-widest uppercase">
        UP Wellness · Science-based · Personalized · Longevity-first
      </footer>

      <!-- ── Toast ── -->
      <div className=${`toast ${toast ? 'show' : ''} glass-dark rounded-full px-5 py-2.5 text-sm font-medium`}>${toast}</div>
    </div>
  `;
}

/* ─── Card components ───────────────────────────────────────────── */

function ProductCard({ product, expanded, onToggle, onCopy }) {
  const c = CATEGORIES[product.cat];
  return html`
    <div className="glass glass-shine rounded-3xl p-6 cursor-pointer relative" onClick=${onToggle}>
      <!-- Top accent line -->
      <div
        className="absolute top-0 left-6 right-6 h-[2px] rounded-full"
        style=${{ background: `linear-gradient(90deg, ${c.color}, transparent)` }}
      ></div>

      <!-- Category + price -->
      <div className="flex items-start justify-between mb-3">
        <div className="flex items-center gap-2">
          <span className="cat-dot" style=${{ background: c.color, color: c.color }}></span>
          <span className="font-mono text-[9px] tracking-widest uppercase text-ink-60">${c.label}</span>
        </div>
        <span className="font-mono text-xs font-bold text-ink">
          ${product.price ? `฿${product.price.toLocaleString()}` : 'ปรึกษาราคา'}
        </span>
      </div>

      <!-- Product name -->
      <h3 className="font-display text-xl font-semibold text-ink leading-tight">${product.name}</h3>
      <p className="font-thai text-[11px] text-ink-40 mt-0.5">${product.name_th} · ${product.sku}</p>

      <!-- Fields -->
      <div className="mt-4 space-y-2.5 text-[13px] leading-relaxed">
        <div>
          <div className="font-mono text-[9px] tracking-widest uppercase text-ink-40 mb-0.5">DESC</div>
          <p className="text-ink">${product.desc}</p>
        </div>
        <div>
          <div className="font-mono text-[9px] tracking-widest uppercase text-ink-40 mb-0.5">สรรพคุณ</div>
          <p className="text-ink">${product.benefits}</p>
        </div>
        <div>
          <div className="font-mono text-[9px] tracking-widest uppercase text-ink-40 mb-0.5">TARGET</div>
          <p className="text-ink">${product.target}</p>
        </div>
      </div>

      <!-- Marketing opener (expandable) -->
      <div className=${`mt-4 rounded-2xl transition-all duration-300 overflow-hidden ${expanded ? 'opacity-100' : 'opacity-80'}`}>
        <div
          className="px-4 py-3 rounded-2xl border"
          style=${{
            background: `linear-gradient(135deg, ${c.color}15, ${c.color}05)`,
            borderColor: `${c.color}30`,
          }}
        >
          <div className="flex items-start justify-between gap-2">
            <div className="flex-1">
              <div className="font-mono text-[9px] tracking-widest uppercase mb-1" style=${{ color: c.color }}>
                💬 ประโยคเปิดใจ
              </div>
              <p className="font-display italic text-[15px] leading-snug text-ink">"${product.opener}"</p>
            </div>
            ${expanded && html`
              <button
                onClick=${(e) => { e.stopPropagation(); onCopy(product.opener); }}
                className="flex-shrink-0 px-3 py-1 bg-ink text-cream rounded-full text-[10px] font-mono font-bold tracking-wider hover:bg-rose transition"
              >COPY</button>
            `}
          </div>
        </div>
      </div>
    </div>
  `;
}

function ProductRow({ product, expanded, onToggle, onCopy }) {
  const c = CATEGORIES[product.cat];
  return html`
    <div className="glass rounded-2xl overflow-hidden">
      <div onClick=${onToggle} className="cursor-pointer px-5 py-4 grid grid-cols-12 gap-3 items-center hover:bg-white/30 transition">
        <!-- Category dot -->
        <div className="col-span-1 flex justify-center">
          <span className="cat-dot" style=${{ background: c.color, color: c.color }}></span>
        </div>
        <!-- Name -->
        <div className="col-span-5 md:col-span-3">
          <div className="font-display text-base font-semibold text-ink">${product.name}</div>
          <div className="font-mono text-[10px] text-ink-40">${product.sku}</div>
        </div>
        <!-- Desc -->
        <div className="col-span-12 md:col-span-5 text-[12.5px] text-ink-60 leading-snug">${product.desc}</div>
        <!-- Price -->
        <div className="col-span-3 md:col-span-2 text-right">
          <div className="font-mono text-sm font-bold text-ink">
            ${product.price ? `฿${product.price.toLocaleString()}` : 'ปรึกษา'}
          </div>
          <div className="font-mono text-[9px] uppercase tracking-widest text-ink-40">${c.label}</div>
        </div>
        <!-- Toggle -->
        <div className="col-span-3 md:col-span-1 text-right text-ink-40">${expanded ? '▼' : '›'}</div>
      </div>

      <!-- Expanded panel -->
      ${expanded && html`
        <div className="px-5 pb-4 pt-2 border-t border-white/40 grid md:grid-cols-3 gap-4">
          <div>
            <div className="font-mono text-[9px] tracking-widest uppercase text-ink-40 mb-1">สรรพคุณ</div>
            <p className="text-[13px] text-ink leading-relaxed">${product.benefits}</p>
          </div>
          <div>
            <div className="font-mono text-[9px] tracking-widest uppercase text-ink-40 mb-1">TARGET</div>
            <p className="text-[13px] text-ink leading-relaxed">${product.target}</p>
          </div>
          <div
            className="rounded-xl px-4 py-3 border"
            style=${{
              background: `linear-gradient(135deg, ${c.color}15, ${c.color}05)`,
              borderColor: `${c.color}30`,
            }}
          >
            <div className="flex items-start justify-between gap-2 mb-1">
              <div className="font-mono text-[9px] tracking-widest uppercase" style=${{ color: c.color }}>
                💬 ประโยคเปิดใจ
              </div>
              <button
                onClick=${(e) => { e.stopPropagation(); onCopy(product.opener); }}
                className="px-2 py-0.5 bg-ink text-cream rounded-full text-[9px] font-mono font-bold hover:bg-rose transition"
              >COPY</button>
            </div>
            <p className="font-display italic text-[14px] leading-snug text-ink">"${product.opener}"</p>
          </div>
        </div>
      `}
    </div>
  `;
}

const root = createRoot(document.getElementById('root'));
root.render(html`<${App} />`);
</script>

</body>
</html>
