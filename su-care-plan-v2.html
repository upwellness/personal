                <XAxis dataKey="short" stroke="#A8A5A0" style={{ fontSize: 12 }} />
                <YAxis stroke="#A8A5A0" style={{ fontSize: 12 }} />

                    padding: 12,
                    fontFamily: "Sarabun, sans-serif",
                  }}
                  formatter={(v, n, p) => [`${v} ${metricDef.unit}`, metricDef.label]}
                  labelFormatter={(l, payload) => payload?.[0]?.payload?.date ?? l}
                />
                <ReferenceLine y={metricDef.target} stroke="#16A34A" strokeDasharray="4 4" label={{ value: metricDef.targetLabel, position: "right", fill: "#16A34A", fontSize: 11 }} />
                <Line
                  type="monotone" dataKey="value"
                  stroke={metricDef.color} strokeWidth={3}
                  dot={(props) => {
                    const { cx, cy, payload } = props;
                    const isBest = payload.best;
                    return (
                      <g>
                        <circle cx={cx} cy={cy} r={isBest ? 10 : 5} fill={isBest ? "#FBBF24" : metricDef.color} stroke="white" strokeWidth={2} />
                        {isBest && <text x={cx} y={cy - 18} textAnchor="middle" fontSize="11" fontWeight="bold" fill="#92400E">✨ Best</text>}
                      </g>
                    );
                  }}
                  activeDot={{ r: 8 }}
                />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>

/* ─── App ────────────────────────────────────────────── */

function App() {
  const [active, setActive] = useState("overview");

  useEffect(() => {
    const opts = { rootMargin: "-30% 0% -60% 0%", threshold: 0 };
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
    }, opts);
    SECTIONS.forEach((s) => {
      const el = document.getElementById(s.id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, []);

  const onJump = (id) => {
    document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  return (
    <div className="min-h-screen">
      <Hero />
      <StickyNav active={active} onJump={onJump} />
      <Overview />
      <Timeline />
      <CgmSection />
      <PlanSection />
      <Targets />
      <Questions />
      <FooterBlock />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
