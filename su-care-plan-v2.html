/* ─── Custom SVG line chart (no Recharts) ─────────────────── */
function TimelineChart({ data, color, target, targetLabel, unit }) {
  const W = 760, H = 320, pad = { top: 20, right: 30, bottom: 36, left: 50 };
  const xs = data.map((_, i) => i);
  const ys = data.map((d) => d.value);
  const allYs = [...ys, target];
  const yMin = Math.min(...allYs) * 0.92;
  const yMax = Math.max(...allYs) * 1.08;
  const xScale = (i) => pad.left + (i / Math.max(1, data.length - 1)) * (W - pad.left - pad.right);
  const yScale = (v) => pad.top + (1 - (v - yMin) / (yMax - yMin)) * (H - pad.top - pad.bottom);

  const linePath = data.map((d, i) => (i === 0 ? "M" : "L") + xScale(i) + " " + yScale(d.value)).join(" ");
  const yTicks = 4;
  const yTickValues = Array.from({ length: yTicks + 1 }, (_, i) => yMin + (i / yTicks) * (yMax - yMin));

  return html`
    <svg className="chart-svg" viewBox=${"0 0 " + W + " " + H} style=${{ width: "100%", height: "auto" }} preserveAspectRatio="xMidYMid meet">
      ${yTickValues.map((v, i) => html`
        <g key=${"y" + i}>
          <line className="grid-line" x1=${pad.left} y1=${yScale(v)} x2=${W - pad.right} y2=${yScale(v)} />
          <text className="axis" x=${pad.left - 8} y=${yScale(v) + 4} textAnchor="end">${v.toFixed(0)}</text>
        </g>`)}

      <line className="target" x1=${pad.left} y1=${yScale(target)} x2=${W - pad.right} y2=${yScale(target)} />
      <text className="target-label" x=${W - pad.right - 4} y=${yScale(target) - 6} textAnchor="end">${targetLabel}</text>

      <path d=${linePath} fill="none" stroke=${color} strokeWidth="3" />

      ${data.map((d, i) => {
        const cx = xScale(i), cy = yScale(d.value);
        const isBest = d.best;
        return html`
          <g key=${"pt" + i}>
            <circle cx=${cx} cy=${cy} r=${isBest ? 9 : 5} fill=${isBest ? "#FBBF24" : color} stroke="white" strokeWidth="2.5" />
            ${isBest && html`<text x=${cx} y=${cy - 18} textAnchor="middle" fontSize="11" fontWeight="bold" fill="#92400E">✨ Best</text>`}
            <text className="axis" x=${cx} y=${H - 18} textAnchor="middle">${d.short}</text>
            <title>${d.date}: ${d.value} ${unit}</title>
          </g>`;
      })}
    </svg>`;
}

function MiniTrend({ history, metric, color }) {
  const W = 100, H = 24;
  const data = history.filter((d) => d[metric] != null).map((d) => d[metric]);
  if (data.length < 2) return null;
  const min = Math.min(...data) * 0.95;
  const max = Math.max(...data) * 1.05;
  const points = data.map((v, i) => {
    const x = (i / (data.length - 1)) * W;
    const y = H - ((v - min) / (max - min)) * H;
    return x + "," + y;
  }).join(" ");
  return html`
    <svg viewBox=${"0 0 " + W + " " + H} style=${{ width: 100, height: 24 }} preserveAspectRatio="none">
      <polyline points=${points} fill="none" stroke=${color} strokeWidth="2" />
    </svg>`;
}

        </div>

function App() {
  const [active, setActive] = useState("overview");

  useEffect(() => {
    const opts = { rootMargin: "-30% 0% -60% 0%", threshold: 0 };
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
    }, opts);
    SECTIONS.forEach((s) => {
      const el = document.getElementById(s.id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, []);

  const onJump = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  return html`
    <div className="min-h-screen">
      <${Hero} />
      <${StickyNav} active=${active} onJump=${onJump} />
      <${Overview} />
      <${Timeline} />
      <${CgmSection} />
      <${SystemReview} />
      <${PlanSection} />
      <${Targets} />
      <${Questions} />
      <${FooterBlock} />
    </div>`;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(html`<${App} />`);
</script>
