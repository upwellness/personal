    background: rgba(31, 30, 27, 0.88);

    background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent);

  /* 3D card flip */
  .perspective { perspective: 1500px; }
  .card-3d { transform-style: preserve-3d; transition: transform 700ms cubic-bezier(0.4, 0, 0.2, 1); }
  .card-3d.flipped { transform: rotateY(180deg); }
  .card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .card-back { transform: rotateY(180deg); }

  /* Match game tile */
  .tile-3d { transform-style: preserve-3d; transition: transform 500ms cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }

  .cat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 100px; background: currentColor; }

  /* Pulse on correct */
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) {

/* ─── small helpers ─────────────────────────────────────── */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* MODE 1 · PAIR PRACTICE                                            */
/* Deck overview · seen tracker (no repeats) · explicit reset        */
/* ═══════════════════════════════════════════════════════════════ */
function PairPractice({ showToast }) {
  // seen = SKUs reviewed (not including the current pair)
  const [seen, setSeen]   = useState(() => new Set());
  const [pair, setPair]   = useState(() => pickFresh(new Set(), []));
  const [flips, setFlips] = useState([false, false]);

  function pickFresh(seenSet, excludeSkus) {
    const avail = PRODUCTS.filter(p => !seenSet.has(p.sku) && !excludeSkus.includes(p.sku));
    if (avail.length < 2) return null;
    const s = shuffle(avail);
    return [s[0], s[1]];
  }

  const drawNew = () => {
    // Mark current pair as seen first
    const nextSeen = new Set(seen);
    if (pair) pair.forEach(p => nextSeen.add(p.sku));
    setSeen(nextSeen);

    const next = pickFresh(nextSeen, []);
    if (next) {
      setPair(next);
      setFlips([false, false]);
    } else {
      setPair(null);
      showToast('🏆 เปิดครบทุกสินค้าแล้ว · กด Reset เพื่อเริ่มใหม่');
    }
  };

  const reset = () => {
    const fresh = new Set();
    setSeen(fresh);
    setPair(pickFresh(fresh, []));
    setFlips([false, false]);
    showToast('↺ รีเซ็ตเรียบร้อย · เริ่มรอบใหม่ได้เลย');
  };

  const flipBoth = () => {
    const allFlipped = flips.every(Boolean);
    setFlips(allFlipped ? [false, false] : [true, true]);
  };
  const flipOne = (i) => setFlips(prev => prev.map((f, idx) => (idx === i ? !f : f)));

  // Click on an overview thumbnail → make it the right card (if unseen and not current)
  const jumpTo = (product) => {
    if (!pair) return;
    if (seen.has(product.sku)) return;
    if (pair.some(p => p.sku === product.sku)) return;
    setPair([pair[0], product]);
    setFlips([flips[0], false]);
  };

  const total       = PRODUCTS.length;
  const seenCount   = seen.size;
  const currentSkus = pair ? pair.map(p => p.sku) : [];
  const isDone      = !pair;
  const progressPct = Math.round((seenCount / total) * 100);

  return html`
    <div>
      <!-- ── Score + control bar ── -->
      <div className="glass rounded-2xl p-4 mb-5 flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-5 flex-wrap">
          <div>
            <div className="font-mono text-[9px] tracking-widest uppercase text-rose-deep">Reviewed</div>
            <div className="font-display text-2xl font-bold text-ink">${seenCount} <span className="text-sm text-ink-40">/ ${total}</span></div>
          </div>
          <div className="hidden sm:block h-10 w-px bg-ink-10" />
          <div className="flex-1 min-w-[150px] max-w-xs">
            <div className="font-mono text-[9px] tracking-widest uppercase text-ink-40 mb-1">Progress</div>
            <div className="h-2 rounded-full bg-ink-10 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-rose to-green transition-all duration-500" style=${{ width: progressPct + '%' }} />
            </div>
          </div>
        </div>
        <div className="flex items-center gap-2 no-print">
          ${!isDone && html`
            <button onClick=${flipBoth}
              className="rounded-full px-4 py-2 text-xs font-semibold border border-ink-10 hover:border-rose hover:text-rose transition">
              🔁 พลิกทั้งคู่
            </button>
            <button onClick=${drawNew}
              className="rounded-full bg-ink text-cream px-5 py-2 text-xs font-semibold hover:bg-rose transition">
              🎲 สุ่มคู่ใหม่
            </button>
          `}
          <button onClick=${reset}
            className=${`rounded-full px-4 py-2 text-xs font-semibold transition ${
              isDone
                ? 'bg-rose text-white hover:bg-rose-deep'
                : 'border border-ink-10 text-ink-60 hover:border-rose hover:text-rose'
            }`}>
            ↺ Reset
          </button>
        </div>
      </div>

      <!-- ── 2 active cards ── -->
      ${isDone ? html`
        <div className="glass glass-shine rounded-3xl p-10 text-center mb-5">
          <div className="text-6xl mb-4">🏆</div>
          <div className="font-display text-3xl md:text-4xl font-semibold text-ink mb-2">เปิดครบทุกสินค้าแล้ว!</div>
          <p className="font-thai text-ink-60 max-w-md mx-auto mb-6">
            คุณทบทวนครบทั้ง ${total} สินค้า · กด <strong>Reset</strong> เพื่อเริ่มรอบใหม่ หรือลอง mode อื่นต่อ
          </p>
          <button onClick=${reset}
            className="rounded-full bg-ink text-cream px-7 py-3 text-sm font-semibold hover:bg-rose transition">
            ↺ เริ่มรอบใหม่
          </button>
        </div>
      ` : html`
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
          ${pair.map((p, i) => html`
            <${FlipCard} key=${p.sku + '-' + i} product=${p} flipped=${flips[i]} onFlip=${() => flipOne(i)} />
          `)}
        </div>
      `}

      <!-- ── Deck overview (all 20 thumbnails) ── -->
      <div className="glass rounded-2xl p-4 md:p-5 mb-5">
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <div className="font-mono text-[10px] tracking-widest uppercase text-ink-60 font-bold">
            🗂  Deck overview · ${total} สินค้า
          </div>
          <div className="flex items-center gap-3 font-mono text-[9.5px] text-ink-40">
            <span className="flex items-center gap-1.5">
              <span className="h-2 w-2 rounded-full bg-rose" />
              CURRENT
            </span>
            <span className="flex items-center gap-1.5">
              <span className="h-2 w-2 rounded-full bg-ink-20" />
              UNSEEN
            </span>
            <span className="flex items-center gap-1.5">
              <span className="h-2 w-2 rounded-full bg-green" />
              SEEN
            </span>
          </div>
        </div>
        <div className="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-7 lg:grid-cols-10 gap-2">
          ${PRODUCTS.map(p => {
            const c = CATEGORIES[p.cat] || { color: '#8C4C4C' };
            const isSeen    = seen.has(p.sku);
            const isCurrent = currentSkus.includes(p.sku);
            const stateCls  = isCurrent
              ? 'ring-2 ring-rose bg-rose-mist/60 shadow-md'
              : isSeen
                ? 'bg-green-mist/30 opacity-50 hover:opacity-70 cursor-default'
                : 'bg-white/60 hover:bg-white hover:-translate-y-0.5 cursor-pointer';
            return html`
              <button key=${p.sku}
                onClick=${() => jumpTo(p)}
                disabled=${isSeen || isCurrent || isDone}
                title=${`${p.name} · ${p.sku}${isSeen ? ' (เปิดแล้ว)' : isCurrent ? ' (อยู่ในคู่ปัจจุบัน)' : ' (คลิกเพื่อเลือก)'}`}
                className=${`relative rounded-xl border border-white/50 px-2 py-2 text-left transition-all ${stateCls}`}
              >
                <div className="flex items-center gap-1.5 mb-1">
                  <span className="h-1.5 w-1.5 rounded-full shrink-0" style=${{ background: c.color }} />
                  <span className="font-mono text-[8px] uppercase tracking-widest text-ink-60 truncate">${c.label}</span>
                </div>
                <div className="font-display text-[11.5px] font-semibold text-ink leading-tight truncate">${p.name}</div>
                ${isSeen && html`<span className="absolute top-1 right-1 text-[10px] text-green font-bold">✓</span>`}
                ${isCurrent && html`<span className="absolute top-1 right-1 text-[10px] text-rose font-bold animate-pulse">●</span>`}
              </button>
            `;
          })}
        </div>
      </div>

      <!-- ── Practice prompt ── -->
      <div className="glass-rose glass-shine rounded-2xl p-5">
        <div className="font-mono text-[10px] tracking-widest uppercase text-rose-deep font-bold mb-2">💬 วิธีเล่น</div>
        <ol className="font-thai text-[13.5px] text-ink leading-relaxed space-y-1 list-decimal list-inside">
          <li><strong>คลิกการ์ดทีละใบ</strong> เพื่อดูชื่อสินค้า — แล้ว <em>พูดสรรพคุณ · target · opener</em> ออกมาให้ได้</li>
          <li>คลิกพลิกอีกครั้งเพื่อดู <em>เฉลย</em> ของสินค้านั้น — เช็คว่าตรงไหม</li>
          <li>กด <strong>🎲 สุ่มคู่ใหม่</strong> เพื่อข้ามไป — สินค้าที่เปิดแล้วจะไม่ถูกสุ่มซ้ำ</li>
          <li>ใน <strong>Deck overview</strong> คลิกชื่อสินค้าที่ยังไม่ได้เปิด เพื่อสลับเข้ามาเป็นคู่ขวา</li>
          <li>กด <strong>↺ Reset</strong> เมื่อต้องการเริ่มรอบใหม่</li>

      </div>

  `;
}

/* MODE 2 · MEMORY MATCH                                             */
/* 12 tiles · 6 pairs · match product NAME ↔ OPENER                  */
/* ═══════════════════════════════════════════════════════════════ */
function MemoryMatch({ showToast }) {
  const [round, setRound] = useState(0);
  const [pairCount, setPairCount] = useState(6); // 6 pairs = 12 tiles
  const [tiles, setTiles] = useState([]);
  const [flipped, setFlipped] = useState([]);   // ids currently face-up
  const [matched, setMatched] = useState([]);   // ids already matched
  const [moves, setMoves] = useState(0);
  const [startedAt, setStartedAt] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const timerRef = useRef(null);

  useEffect(() => { reset(); }, [round, pairCount]);

  useEffect(() => {
    if (startedAt && matched.length < tiles.length) {
      timerRef.current = setInterval(() => setElapsed(Math.floor((Date.now() - startedAt) / 1000)), 1000);
      return () => clearInterval(timerRef.current);
    }
  }, [startedAt, matched.length, tiles.length]);

  function reset() {
    const picked = shuffle(PRODUCTS).slice(0, pairCount);
    // Each product produces 2 tiles: type='name' and type='opener'
    const ts = [];
    picked.forEach((p, i) => {
      ts.push({ id: i * 2,     pid: i, type: 'name',   product: p });
      ts.push({ id: i * 2 + 1, pid: i, type: 'opener', product: p });
    });
    setTiles(shuffle(ts));
    setFlipped([]);
    setMatched([]);
    setMoves(0);
    setStartedAt(null);
    setElapsed(0);
    if (timerRef.current) clearInterval(timerRef.current);
  }

  const onTileClick = (tile) => {
    if (matched.includes(tile.id) || flipped.includes(tile.id)) return;
    if (flipped.length >= 2) return;
    if (!startedAt) setStartedAt(Date.now());

    const next = [...flipped, tile.id];
    setFlipped(next);

    if (next.length === 2) {
      setMoves(m => m + 1);
      const [a, b] = next.map(id => tiles.find(t => t.id === id));
      if (a.pid === b.pid && a.type !== b.type) {
        // Match!
        setTimeout(() => {
          setMatched(m => [...m, a.id, b.id]);
          setFlipped([]);
          if (matched.length + 2 === tiles.length) {
            showToast(`🏆 ชนะใน ${moves + 1} ครั้ง · ${elapsed}s`);
          }
        }, 600);
      } else {
        // No match — flip back
        setTimeout(() => setFlipped([]), 1100);
      }
    }
  };

  const isDone = tiles.length > 0 && matched.length === tiles.length;
  const cols = pairCount <= 6 ? 'grid-cols-3 md:grid-cols-4' : 'grid-cols-3 md:grid-cols-6';

  return html`
    <div>
      <!-- Score bar -->
      <div className="glass rounded-2xl p-4 mb-6 flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-5 flex-wrap">
          <div>
            <div className="font-mono text-[9px] tracking-widest uppercase text-rose-deep">Moves</div>
            <div className="font-display text-2xl font-bold text-ink">${moves}</div>
          </div>
          <div className="h-10 w-px bg-ink-10" />
          <div>
            <div className="font-mono text-[9px] tracking-widest uppercase text-rose-deep">Time</div>
            <div className="font-display text-2xl font-bold text-ink">${elapsed}s</div>
          </div>
          <div className="h-10 w-px bg-ink-10" />
          <div>
            <div className="font-mono text-[9px] tracking-widest uppercase text-rose-deep">Matched</div>
            <div className="font-display text-2xl font-bold text-ink">${matched.length / 2} / ${tiles.length / 2}</div>
          </div>
          ${isDone && html`
            <div className="font-display text-2xl text-rose font-bold pop">🏆 WIN!</div>
          `}
        </div>
        <div className="flex items-center gap-2 no-print">
          <select value=${pairCount} onChange=${e => setPairCount(Number(e.target.value))}
            className="rounded-full px-3 py-2 text-xs font-mono border border-ink-10 bg-white/70">
            <option value=${6}>6 pairs · Easy</option>
            <option value=${8}>8 pairs · Medium</option>
            <option value=${10}>10 pairs · Hard</option>
          </select>
          <button onClick=${() => setRound(r => r + 1)}
            className="rounded-full bg-ink text-cream px-5 py-2 text-xs font-semibold hover:bg-rose transition">
            🔄 เริ่มใหม่
          </button>
        </div>
      </div>

      <!-- Grid of tiles -->
      <div className=${`grid ${cols} gap-3 md:gap-4`}>
        ${tiles.map(t => html`
          <${MatchTile} key=${t.id} tile=${t}
            isFlipped=${flipped.includes(t.id) || matched.includes(t.id)}
            isMatched=${matched.includes(t.id)}
            onClick=${() => onTileClick(t)} />
        `)}
      </div>

      <!-- Rules -->
      <div className="mt-7 glass-rose glass-shine rounded-2xl p-5">
        <div className="font-mono text-[10px] tracking-widest uppercase text-rose-deep font-bold mb-2">🧠 วิธีเล่น</div>
        <ol className="font-thai text-[13.5px] text-ink leading-relaxed space-y-1 list-decimal list-inside">
          <li>คลิกเปิดการ์ด 2 ใบ — จับคู่ <strong>ชื่อสินค้า</strong> กับ <strong>opener</strong> ของสินค้านั้น</li>
          <li>เปิดถูก = คงเปิดไว้ · เปิดผิด = ปิดกลับ ต้องจำตำแหน่ง</li>
          <li>เป้าหมาย: จับคู่ครบใน <em>moves น้อยที่สุด · เวลาสั้นที่สุด</em></li>
        </ol>
      </div>
    </div>
  `;
}

function MatchTile({ tile, isFlipped, isMatched, onClick }) {
  const c = CATEGORIES[tile.product.cat] || { color: '#8C4C4C' };
  return html`
    <div className="perspective aspect-[3/4]">
      <div className=${`relative w-full h-full tile-3d ${isFlipped ? 'flipped' : ''} ${isMatched ? 'matched' : ''}`}
        onClick=${onClick}>

        <!-- Back (showing first) -->
        <div className="card-face absolute inset-0 glass-rose glass-shine rounded-2xl flex items-center justify-center">
          <div className="font-display text-4xl text-rose-deep/40 font-bold">?</div>
        </div>

        <!-- Front (revealed) -->
        <div className="card-face card-back absolute inset-0 glass glass-shine rounded-2xl p-3 flex flex-col">
          <div className="flex items-center gap-1.5 mb-2">
            <span className="cat-dot" style=${{ background: c.color, color: c.color }}></span>
            <span className="font-mono text-[8px] tracking-widest uppercase text-ink-60 font-bold">${tile.type === 'name' ? 'PRODUCT' : 'OPENER'}</span>
          </div>
          ${tile.type === 'name' ? html`
            <div className="flex-1 flex flex-col items-center justify-center text-center">
              <div className="font-display text-[18px] md:text-[22px] font-semibold text-ink leading-tight">${tile.product.name}</div>
              <div className="font-mono text-[9px] text-ink-40 mt-1">${tile.product.sku}</div>
            </div>
          ` : html`
            <div className="flex-1 flex items-center text-left">
              <p className="font-display italic text-[13px] md:text-[14px] leading-snug text-ink">"${tile.product.opener}"</p>
            </div>
          `}
          ${isMatched && html`
            <div className="text-center font-mono text-[9px] uppercase tracking-widest text-rose font-bold pop">✓ MATCHED</div>
          `}
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════ */
/* MODE 3 · QUIZ BATTLE                                              */
/* Shows opener — guess which product it belongs to (4 choices)      */
/* 10 rounds · score · time                                          */
/* ═══════════════════════════════════════════════════════════════ */
const TOTAL_ROUNDS = 10;

function QuizBattle({ showToast }) {
  const [round, setRound]   = useState(0);
  const [score, setScore]   = useState(0);
  const [picked, setPicked] = useState(null);
  const [reveal, setReveal] = useState(false);
  const [seed, setSeed]     = useState(0);

  const challenge = useMemo(() => {
    const shuffled = shuffle(PRODUCTS);
    const correct = shuffled[0];
    const distractors = shuffled.slice(1, 4);
    const options = shuffle([correct, ...distractors]);
    return { correct, options };
  }, [round, seed]);

  const isDone = round >= TOTAL_ROUNDS;

  const onPick = (p) => {
    if (picked) return;
    setPicked(p);
    setReveal(true);
    const isCorrect = p.sku === challenge.correct.sku;
    if (isCorrect) {
      setScore(s => s + 1);
      showToast('✓ ถูกต้อง!');
    } else {
      showToast(`✗ ที่ถูกคือ ${challenge.correct.name}`);
    }
    setTimeout(() => {
      setPicked(null);
      setReveal(false);
      setRound(r => r + 1);
    }, 1800);
  };

  const restart = () => {
    setRound(0);
    setScore(0);
    setPicked(null);
    setReveal(false);
    setSeed(s => s + 1);
  };

  if (isDone) {
    const pct = Math.round((score / TOTAL_ROUNDS) * 100);
    const grade = pct >= 90 ? '🏆 EXPERT'
                : pct >= 70 ? '⭐ PRO'
                : pct >= 50 ? '👍 GOOD'
                : '📚 KEEP PRACTICING';
    return html`
      <div className="glass glass-shine rounded-3xl p-10 text-center">
        <div className="font-mono text-[11px] tracking-widest uppercase text-rose-deep font-bold mb-4">Final score</div>
        <div className="font-display text-7xl font-bold text-ink mb-3">${score} / ${TOTAL_ROUNDS}</div>
        <div className="font-display text-3xl text-rose italic mb-6">${grade}</div>
        <div className="font-thai text-ink-60 mb-8 max-w-md mx-auto">
          ${pct >= 90 ? 'รู้ทุก opener แล้ว · พร้อมคุยกับลูกค้าตัวจริง'
            : pct >= 70 ? 'แม่นมาก · ทบทวนอีกนิดให้ครบทุกสินค้า'
            : pct >= 50 ? 'พื้นฐานดี · ลองเล่น Pair Practice ก่อนกลับมา'
            : 'เริ่มจาก Pair Practice เพื่อทำความรู้จักสินค้าก่อนก็ได้'}
        </div>
        <button onClick=${restart}
          className="rounded-full bg-ink text-cream px-7 py-3 text-sm font-semibold hover:bg-rose transition">
          🔄 เริ่มใหม่
        </button>
      </div>
    `;
  }

  return html`
    <div>
      <!-- Progress bar -->
      <div className="glass rounded-2xl p-4 mb-6 flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-5 flex-wrap">
          <div>
            <div className="font-mono text-[9px] tracking-widest uppercase text-rose-deep">Round</div>
            <div className="font-display text-2xl font-bold text-ink">${round + 1} / ${TOTAL_ROUNDS}</div>
          </div>
          <div className="h-10 w-px bg-ink-10" />
          <div>
            <div className="font-mono text-[9px] tracking-widest uppercase text-rose-deep">Score</div>
            <div className="font-display text-2xl font-bold text-rose">${score}</div>
          </div>
        </div>
        <div className="flex-1 max-w-xs ml-auto">
          <div className="h-2 rounded-full bg-ink-10 overflow-hidden">
            <div className="h-full bg-gradient-to-r from-rose to-green transition-all duration-500" style=${{ width: `${((round) / TOTAL_ROUNDS) * 100}%` }} />
          </div>
        </div>
      </div>

      <!-- Opener card -->
      <div className="glass-rose glass-shine rounded-3xl p-8 md:p-10 mb-6">
        <div className="font-mono text-[10px] tracking-widest uppercase text-rose-deep font-bold mb-3">💬 ประโยคเปิดใจ · เป็นของสินค้าไหน?</div>
        <p className="font-display italic text-[26px] md:text-[34px] leading-snug text-ink">
          "${challenge.correct.opener}"
        </p>
      </div>

      <!-- Choices -->
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        ${challenge.options.map((opt) => {
          const isCorrect = reveal && opt.sku === challenge.correct.sku;
          const isWrongPick = reveal && picked?.sku === opt.sku && opt.sku !== challenge.correct.sku;
          const c = CATEGORIES[opt.cat];
          return html`
            <button key=${opt.sku}
              disabled=${!!picked}
              onClick=${() => onPick(opt)}
              className=${`text-left rounded-2xl p-5 border transition-all ${
                isCorrect ? 'bg-green/15 border-green pop' :
                isWrongPick ? 'bg-rose/15 border-rose shake' :
                'glass border-white/60 hover:-translate-y-0.5 hover:border-rose'
              }`}
            >
              <div className="flex items-center gap-2 mb-2">
                <span className="cat-dot" style=${{ background: c.color, color: c.color }}></span>
                <span className="font-mono text-[9px] tracking-widest uppercase text-ink-60">${c.label}</span>
                ${isCorrect && html`<span className="ml-auto text-green text-xl">✓</span>`}
                ${isWrongPick && html`<span className="ml-auto text-rose text-xl">✗</span>`}
              </div>
              <div className="font-display text-[20px] md:text-[22px] font-semibold text-ink leading-tight">${opt.name}</div>
              <div className="font-mono text-[10px] text-ink-40 mt-1">${opt.sku}</div>
              ${isCorrect && html`<div className="mt-2 font-thai text-[12.5px] text-green-deep leading-snug">${opt.benefits}</div>`}
            </button>
          `;
        })}
      </div>

      <!-- Rules -->
      <div className="mt-7 glass rounded-2xl p-5">
        <div className="font-mono text-[10px] tracking-widest uppercase text-ink-60 font-bold mb-2">⚡ วิธีเล่น</div>
        <ol className="font-thai text-[13.5px] text-ink leading-relaxed space-y-1 list-decimal list-inside">
          <li>อ่าน <strong>opener</strong> ด้านบน — เดาว่าน่าจะเป็นของสินค้าตัวไหน</li>
          <li>คลิกตัวเลือก 1 ใน 4 · ระบบเฉลยทันที</li>
          <li>เล่นครบ ${TOTAL_ROUNDS} รอบ → ดูคะแนน + grade</li>
        </ol>
      </div>
    </div>
  `;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</body>
</html>
