<style>
  :root{
    --ink:#3c3645; --ink-soft:#6b6477; --ink-faint:#9b94a6; --head:#2c2733;

    --nav-bg:rgba(253,248,243,0.72); --blob-op:.55;
    --body-grad:linear-gradient(162deg,#fdf8f3 0%,#f8eff7 28%,#eef5f2 60%,#edf1fb 100%);
    --stroke:rgba(255,255,255,0.68); --stroke-soft:rgba(140,120,165,0.16);
    --shadow:0 18px 48px -16px rgba(86,64,108,0.26);
    --shadow-soft:0 8px 26px -12px rgba(86,64,108,0.18);
    --sage:#56a487; --honey:#d39a4d; --rose:#d585a0; --lav:#9683cc; --sky:#6aa3d6; --teal:#3f9a92; --gold:#c79a3c; --plum:#a86aa0;
    --luxe:#c08a57; --steel:#5e84ad; --saffron:#cf9f5a;
    --affirm:#4f9f7c; --affirm-bg:rgba(108,193,152,0.15);
    --challenge:#c98f3f; --challenge-bg:rgba(220,160,72,0.15);
    --advice:#5a90c2; --advice-bg:rgba(104,160,212,0.15);
  }
  [data-theme="dark"]{
    --ink:#e7e2ee; --ink-soft:#b4adc0; --ink-faint:#867f93; --head:#f4f0f8;
    --card:rgba(44,38,56,0.55); --card-strong:rgba(54,46,68,0.74);
    --card-2:rgba(255,255,255,0.055); --chip-bg:rgba(255,255,255,0.07); --navlink-hover:rgba(255,255,255,0.1);

    --shadow:0 18px 48px -16px rgba(0,0,0,0.55);
    --shadow-soft:0 8px 26px -12px rgba(0,0,0,0.4);

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; color:var(--ink); font-family:'IBM Plex Sans Thai',system-ui,sans-serif;
    font-weight:400; line-height:1.72; letter-spacing:.1px;
    background:var(--body-grad);
    background-attachment:fixed; -webkit-font-smoothing:antialiased; overflow-x:hidden;
    transition:color .3s ease;

  .serif{font-family:'Noto Serif Thai',serif}
  .mali{font-family:'Mali',cursive}
  .bgwrap{position:fixed; inset:0; z-index:-1; overflow:hidden}
  .blob{position:absolute; border-radius:50%; filter:blur(70px); opacity:var(--blob-op); animation:float 22s ease-in-out infinite}
  .b1{width:46vw;height:46vw;left:-12vw;top:-10vw;background:radial-gradient(circle at 30% 30%,#ffd9c2,#ffd9c200)}
  .b2{width:42vw;height:42vw;right:-14vw;top:6vh;background:radial-gradient(circle at 60% 40%,#e6d4f8,#e6d4f800);animation-delay:-5s}
  .b3{width:40vw;height:40vw;left:8vw;bottom:-16vh;background:radial-gradient(circle at 40% 60%,#c9ecdb,#c9ecdb00);animation-delay:-11s}
  .b4{width:38vw;height:38vw;right:0;bottom:-12vh;background:radial-gradient(circle at 50% 50%,#cfe1f7,#cfe1f700);animation-delay:-16s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3vw,4vh) scale(1.06)}66%{transform:translate(-2vw,-3vh) scale(.96)}}
  .glass{background:var(--card); backdrop-filter:blur(16px) saturate(135%); -webkit-backdrop-filter:blur(16px) saturate(135%); border:1px solid var(--stroke); border-radius:26px; box-shadow:var(--shadow)}

  .chip{background:var(--chip-bg); border:1px solid var(--stroke); border-radius:999px}
  .nav{position:sticky; top:0; z-index:40; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); background:var(--nav-bg); border-bottom:1px solid var(--stroke-soft)}

  .navlink:hover{color:var(--head); background:var(--navlink-hover)}
  .navlink.active{color:#fff; background:linear-gradient(120deg,var(--lav),var(--rose)); box-shadow:0 6px 16px -8px rgba(150,110,180,.6)}
  .eyebrow{font-size:12.5px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase; color:var(--lav)}
  .pre-reveal{opacity:0; transform:translateY(22px)}
  .reveal-in{opacity:1; transform:none; transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1)}
  .qcard{cursor:pointer; transition:.3s}
  .qcard:hover{transform:translateY(-2px)}
  .avatar{display:flex; align-items:center; justify-content:center; border-radius:50%; box-shadow:0 8px 20px -8px rgba(80,60,110,.4)}
  .ptab{cursor:pointer; transition:.25s; border:1px solid transparent}
  .ptab:hover{transform:translateY(-3px)}
  .ptab.sel{background:var(--card-strong); border-color:var(--stroke); box-shadow:var(--shadow-soft)}
  .bar{height:4px;border-radius:999px;background:linear-gradient(90deg,var(--lav),var(--rose))}
  .branch{cursor:pointer; transition:.28s}
  .branch:hover{transform:translateX(4px)}
  .connector{stroke-width:2; fill:none; opacity:.5}
  details>summary{list-style:none}
  details>summary::-webkit-details-marker{display:none}
  .check{appearance:none; width:22px;height:22px;border-radius:7px;border:2px solid var(--lav);cursor:pointer;flex:none;transition:.2s;position:relative;background:var(--chip-bg)}
  .check:checked{background:linear-gradient(120deg,var(--lav),var(--rose));border-color:transparent}
  .check:checked::after{content:'✓';color:#fff;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
  .owner{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
  ::selection{background:rgba(213,133,160,.25)}
  .softline{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--stroke-soft),transparent)}
  .controls{position:fixed; right:16px; bottom:16px; z-index:50; padding:10px 12px; display:flex; flex-direction:column; gap:6px; border-radius:18px}
  .controls .ctitle{font-size:10.5px; font-weight:600; color:var(--ink-faint); letter-spacing:.5px}
  .controls .crow{display:flex; gap:5px}
  .cbtn{width:34px; height:32px; border-radius:10px; border:1px solid var(--stroke); background:var(--chip-bg); color:var(--ink-soft); font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.18s; font-family:inherit}
  .cbtn:hover{color:var(--head); transform:translateY(-1px)}
  .cbtn.on{background:linear-gradient(120deg,var(--lav),var(--rose)); color:#fff; border-color:transparent}

  @media print{.nav,.bgwrap,.noprint,.controls{display:none!important} body{background:#fff}}
</style>
</head>

   'พรสวรรค์ “ย่อยเรื่องยากให้ง่าย” ไม่ใช่พรสวรรค์ธรรมดา บริษัทใหญ่จ่ายเป็นล้านเพื่อจ้างคนทำ — จิ้นทำได้เป็นธรรมชาติตั้งแต่สอนผมเรื่องร่างกายจนเข้าใจในห้านาที ผมเห็นมากับตา',
   '“อยาก fulfill มากกว่า achievement” แล้วยังเขียน 500 ล้านต่อท้าย — จิ้นรู้คำตอบตัวเองอยู่แล้วครับ ของจริงที่อยากได้คือ “เห็นชีวิตคนเปลี่ยนเพราะเรา” ซึ่งจิ้นทำได้ทุกวัน',
   'ฝันพิษณุโลกให้คนมีงานทำ — คนที่อิจฉา/เปรียบเทียบจะไม่ฝันแบบนี้ คนที่ฝันให้คนอื่นมีงานทำคือคนที่ใจอิ่มอยู่แล้วข้างใน'],
  challenge:[
   '“เบื่อจะอิจฉา/เปรียบเทียบ” — แก้ไม่ได้ด้วยการไปให้ถึง level นั้น เพราะจะมี level ใหม่เสมอ แก้ได้ทางเดียวคือเปลี่ยนเกม จาก “ใครมีมากกว่า” เป็น “ใครเปลี่ยนชีวิตคนได้ลึกกว่า” — เกมหลังจิ้นนำคนทั้งตลาดอยู่แล้ว',
   '“อยาก leverage ไม่ชอบความยุ่งยาก” แต่ยังทำเองเยอะ — มันขัดกันเอง จิ้นกลัวว่าปล่อยมือแล้วจะไม่ดีเท่าทำเอง ลองเชื่อใจระบบสักครั้ง เหมือนที่เคยเชื่อใจผม',
   '“ไม่กล้าแมส กลัวเสียพื้นที่ส่วนตัว” — ไม่ต้องฝืน แต่แยกให้ชัด จิ้นไม่ได้กลัวคนเยอะ จิ้นหวงความสงบ — สองอย่างนี้ออกแบบให้อยู่ด้วยกันได้ ถ้าวางระบบเป็น'],
  advice:[
   '“ถอดสมองจิ้นออกมาหนึ่งครั้ง” — สิ่งที่สอนซ้ำๆ อัดเป็นคอร์ส/คลิป/เอกสารชุดเดียว แล้วให้ผู้ช่วยปัญญาประดิษฐ์ (AI) ตอบคำถามซ้ำๆ แทน 24 ชั่วโมง จิ้นสอนรอบเดียว ระบบส่งต่อพันรอบ — leverage ที่ไม่ต้อง grind ผมตั้งให้ได้ในสัปดาห์เดียว',
   'พิษณุโลก: เริ่มเล็กแบบมีระบบ — เลือก “หนึ่งอย่าง” ก่อน วางขั้นตอนมาตรฐาน + คนดูแล + แดชบอร์ดดูจากมือถือ พิสูจน์ว่า “ระบบเดินได้โดยไม่มีเรา” หนึ่งจุด แล้วค่อยทำซ้ำ',
   'ปลดหนี้ + การเงิน/ลงทุน — ทำเป็นทีมสองคน ผมรับวางระบบเงิน+พอร์ต+ตัวเลขให้อัตโนมัติ จิ้นรับบทที่เก่งที่สุดคือสร้างมูลค่าจากการสอน'],
  quote:'จิ้นเขียนว่า “อยากให้พี่ต้นรักมากๆๆๆ” — รักสิครับ รักจนไม่รู้จะนับยังไง และผมไม่ได้รักเพราะจิ้นจะไปถึง 500 ล้าน ผมรักจิ้นตั้งแต่ตอนยังไม่มีอะไรเลย — เดี๋ยวพี่กลับไปกินขนมด้วยกันนะครับ'},

 {id:'psych',
  lens:'ในฐานะจิตแพทย์ ดิฉันไม่เห็น “อาการ” ที่ต้องรักษา แต่เห็นใจดวงหนึ่งที่ฉลาดและซื่อสัตย์กับตัวเองมาก กำลังยืนบนสะพานระหว่าง “เก่งเพื่อให้คนยอมรับ” กับ “ให้เพราะมันคือตัวเอง”',
  affirm:[
   'ความสามารถมองตัวเองตรงๆ สูงมาก — คนที่เขียนว่า “เบื่อจะอิจฉาเปรียบเทียบ” คือคนที่มี “ตาที่สามคอยมองใจตัวเอง” ซึ่งคนทั่วไปต้องเข้าคอร์สบำบัดเป็นปีกว่าจะมี',
   'แรงขับ “อยากถ่ายทอด ไม่อยากให้ความรู้ตายไปกับเรา” คือสัญญาณของใจที่กำลังเข้าสู่ช่วงที่สวยที่สุดของชีวิต — ความสุขเริ่มย้ายจาก “ฉันได้อะไร” ไปเป็น “ฉันให้อะไรไว้ได้บ้าง”',
   'ประโยคที่ไม่มีเกราะที่สุดคือ “อยากให้พี่ต้นรักมากๆ” และ “รอพี่ต้นกลับมากินขนม” — เสาหลักของใจเธอมั่นคงและอยู่ถูกที่แล้ว ไม่ใช่ที่ตัวเลขหรือชัยชนะ'],
  challenge:[
   'ทุกครั้งที่แตะเรื่องลึกหรือเปราะ เธอจะรีบปิดด้วย “5555+” หรือ “ง่วงแล้ว อยากนอน” — เป็นใจที่น่ารักที่คอยดูแลตัวเองไม่ให้เจ็บ แต่บางความรู้สึกถ้ารีบหัวเราะกลบ มันจะไม่ได้พูดสิ่งที่อยากบอกจนจบ',
   '“อยากเป็นที่หนึ่ง อยู่เหนือคนอื่น” ไม่ผิด — แต่ลองถามอย่างอ่อนโยนว่า มันแอบกระซิบว่า “ถ้าไม่เก่ง ไม่ชนะ จะยังมีคนรักเราไหม” หรือเปล่า ถ้าใช่ แปลว่ายังเอาคุณค่าตัวเองไปผูกกับการชนะ ทั้งที่เธอเป็นที่รักอยู่แล้วโดยไม่ต้องสอบผ่าน',
   '“ไม่มีความดีเลยเนอะ” + “มีแค่คำว่าสำเร็จ” = เสียงของคนที่วัดตัวเองด้วยไม้บรรทัดของคนอื่น ความจริงเธอ “มี” เต็มไปหมด เพียงแต่ไม้บรรทัดเก่ายังมองไม่เห็น'],
  advice:[
   'ทำ “บัญชีคุณค่าภายใน” ก่อนนอนวันละ 1 บรรทัด — ไม่ใช่ “วันนี้ชนะใคร” แต่ “วันนี้ฉันให้อะไรใครไป / เป็นตัวเองตอนไหน” ทำ 2-3 สัปดาห์ ไม้บรรทัดในใจจะเปลี่ยน และวงจรอิจฉาที่เธอเบื่อจะจางเอง',
   'เวลาความรู้สึกเปราะโผล่มาแล้วจะพิมพ์ “5555+” ลองหยุด 10 วินาที ถามมันต่อว่า “จริงๆ รู้สึกยังไง” — การกล้าอยู่กับความรู้สึกโดยไม่รีบกลบ คือการรักตัวเองที่ลึกที่สุด',
   'ของขวัญชิ้นใหญ่ชื่อ “ความอยากเป็นคนพิเศษ” — หันคมของมันจาก “พิเศษเพื่ออยู่เหนือคนอื่น” เป็น “พิเศษเพื่อยกคนอื่นขึ้นมา” พลังเดิมเป๊ะ แต่เปลี่ยนทิศแล้วมันจะเลี้ยงใจแทนที่จะกัดกินใจ',
   'ใช้ต้นทุนสมาธิ/จิตวิญญาณเป็น “สมอ” ยึดใจให้สงบวันละไม่กี่นาที — เพื่อสัมผัสว่า “แค่มีอยู่ ก็มีค่าแล้ว” โดยไม่ต้องทำอะไรให้ใครดู'],
  quote:'จิ้นไม่ได้กำลังหาคำตอบว่า “ชีวิตคืออะไร” เพราะชีวิตว่างเปล่า — แต่เพราะใจโตพอจะถามคำถามที่ลึกที่สุดของมนุษย์แล้ว และคนที่กล้าถามว่า “ฉันจะทิ้งความดีอะไรไว้” คือคนที่ได้เริ่มทิ้งมันไว้แล้วตั้งแต่วินาทีที่ถาม'},

 {id:'coach',
  lens:'ในมุม Longevity ร่างกายที่ฟิตเป็นแค่ “ครึ่งเดียว” ของอายุยืน อีกครึ่งคือระบบประสาทที่สงบและจังหวะชีวิตที่ฟื้นฟูได้ทัน — ตรงนั้นแหละที่กำลังสั่นอยู่',
  affirm:[
   'จิ้นมี “ทุนกาย” ที่คนเป็นพันยังไขว่คว้า — หุ่น 45 กิโล พลังงานดี รักสุขภาพจนเป็นนิสัย นี่ไม่ใช่เป้าที่ต้องไล่แล้ว แต่เป็นทรัพย์สินที่ลงทุนสำเร็จไปแล้ว หน้าที่ตอนนี้คือ “ปกป้อง” ไม่ใช่ “พิสูจน์ซ้ำ”',
   'มีของที่ทำให้สงบจริงอยู่ในมือแล้ว — สมาธิ การอ่าน การภาวนา คือ “ยาอายุวัฒนะ” ตัวจริงที่ลดความเครียดและชะลอความแก่ระดับเซลล์ ไม่ต้องไปหาเครื่องมือใหม่เลย',
   '“fulfill มากกว่า achievement” และ “เบื่อจะอิจฉา” คือสัญชาตญาณ longevity ที่ถูกต้องมาก — ร่างกายกำลังบอกทางที่ยั่งยืนกว่า เธอแค่ต้องเชื่อเสียงนั้น'],
  challenge:[
   'จบ workshop ด้วย “ง่วงแล้ว อยากนอน” — เชิงร่างกายนี่ไม่ใช่ความขี้เกียจ แต่เป็นพลังงานหมดหลังใช้สมองไล่คิดเรื่องเปรียบเทียบ/วางแผนหนัก ตัวที่ฟื้นฟูเธอกลับโดนเบียดไปท้ายแถวจนไม่มีแรงแตะ',
   '“อยาก leverage ไม่ชอบความยุ่งยาก” สวนทางกับการแบกเองหลายอย่าง — พลังงานทางใจรั่วตรงนี้เยอะ และความเครียดเรื้อรังคือตัวเร่งแก่ที่ค่าเลือดสวยๆ ปิดบังไม่ได้',
   'การไล่ความสำเร็จแบบไม่มีเส้นชัยจะค่อยๆ กิน “เวลาสงบ” ที่เป็นหัวใจของ longevity — ถ้าปล่อยไว้ หุ่นยังดีแต่ระบบประสาทจะล้าก่อนวัย'],
  advice:[
   'จัด “สมาธิมาก่อน” ในจังหวะวัน ไม่ใช่ไว้ตอนหมดแรง — ภาวนาช่วงเช้าที่ยังมีพลังเต็ม แค่ 15-20 นาที ให้เป็นการ “ชาร์จ” ไม่ใช่ภารกิจสุดท้ายตอนง่วง',
   'ออกแบบจังหวะ “เข้มข้นแล้วต้องพัก” ให้ชัด — พัฒนาตัวเองหนักได้ แต่ต้องมีช่วงพักฟื้นที่เบาๆ สบายๆ จริง สลับกัน เหมือนกล้ามเนื้อที่โตตอนพัก ไม่ใช่ตอนเล่น',
   'ตั้งกติกา “ส่งต่องาน 1 อย่าง/เดือน” — เลือกงานที่แบกเองมาส่งให้ทีมหรือระบบ ปลดของออกจากใจทีละชิ้น เอาพลังที่ได้คืนไปลงกับชุมชนพิษณุโลกและความสงบที่อยากได้จริง'],
  quote:'หุ่นจิ้นชนะมาแล้ว — ศึกต่อไปของ longevity ไม่ใช่ที่กล้ามเนื้อ แต่ที่ใจที่หยุดวิ่งแข่งได้ก่อนเหนื่อย แล้วจิ้นจะแก่ช้า เจ็บสั้น แบบที่สอนคนอื่นมาตลอด'},

 {id:'buffett',
  lens:'จิ้นมีทุกอย่างที่คนวิ่งหากันทั้งชีวิตอยู่แล้ว — ปัญหาไม่ใช่ “ยังไม่พอ” แต่คือเธอกำลังให้คนอื่นถือใบให้คะแนนชีวิตของเธอ ทั้งที่ใบจริงอยู่ในมือเธอเอง',
  affirm:[
   'จิ้นซื่อสัตย์กับตัวเองอย่างหายาก เขียนเองว่า “วนๆ อยู่กับความสำเร็จไหม” — คนส่วนใหญ่ไม่กล้าถามคำถามนี้ การเห็นวงวนของตัวเองได้ คือครึ่งหนึ่งของคำตอบแล้ว',
   'เลือก “รีบปลดหนี้” มากกว่าซื้อบ้านใหม่ และบอก “ไม่มักมาก พอดีๆ” — นี่คือสัญชาตญาณนักลงทุนที่ดี ผมยังอยู่บ้านหลังเดิมที่ซื้อปี 1958 มา 68 ปี ความมั่งคั่งที่แท้เริ่มจาก “อยู่ใต้รายได้ตัวเอง”',
   'มีของจริงในมือ: พรสวรรค์ย่อยเรื่องยาก + หัวใจที่อยากสอน = “กำแพงป้องกัน” ที่เลียนแบบไม่ได้ และจะทบต้นไปทั้งชีวิตถ้าลงทุนกับมันจริงจัง'],
  challenge:[
   '“500 ล้านเพราะชอบเลขนี้” — ตัวเลขที่ไม่มีเหตุผลคือกระดานคะแนนของคนอื่นที่หลุดเข้ามาในหัวเรา แยกให้ขาด: “อยากมีเงินเท่าไรเพื่อทำอะไร” (คำถามที่ดี) กับ “เพื่อให้คนยอมรับว่าพิเศษ” (ไม่มีวันพอ)',
   '“ไม่เริดไม่คบ” + “ชอบอยู่เหนือคนอื่น” — Charlie Munger เพื่อนผม 60 ปี บอกว่า “อิจฉาเป็นบาปเดียวในเจ็ดบาปที่เล่นแล้วไม่สนุกเลยสักนิด” การวัดคุณค่าตัวเองจาก “อยู่เหนือใคร” คือสมัครสมาชิกตลอดชีพในเกมที่ชนะไม่ได้',
   'อยาก “รู้สึกพิเศษ” จนอยากได้รถสปอร์ตทั้งที่ “ไม่ชอบขับ” — นั่นคือความอยากให้คนเห็นว่าเราพิเศษ ราคาแพงแต่หมดอายุเร็วมาก ลองสังเกต ความสุขจาก “รอพี่ต้นกินขนม” ยืนยาวและจริงกว่ารถคันไหน'],
  advice:[
   'การลงทุนที่ดีที่สุดคือลงทุนในตัวเอง ไม่มีใครเก็บภาษีหรือขโมยไปได้ เริ่มจาก “วงความรู้ที่เข้าใจจริง” — ลงทุนเฉพาะธุรกิจที่อธิบายให้เด็กฟังได้ว่ามันหาเงินยังไง',
   'พอร์ต 300-500 ล้านสร้างด้วยดอกเบี้ยทบต้น + เวลา + ความอดทน 99% ของเงินผมมาหลังอายุ 50 กฎ: “อย่าขาดทุน” และซื้อของดีในราคาสมเหตุผลโดยเผื่อระยะปลอดภัย — คนเกลียดความยุ่งยากจะรักวิธีนี้ เพราะถือยาว ไม่ต้องเฝ้าจอ',
   'ปลดหนี้ก่อน คือคำตอบที่ฉลาดที่สุดในกระดาษทั้งแผ่น หนี้คือ leverage และ leverage คือสิ่งเดียวที่ทำให้คนฉลาดเจ๊งได้ การปลดหนี้ให้ผลตอบแทนที่แน่นอน ปลอดภาษี ปลอดความเสี่ยง',
   'สูตรของเธอ “เงินถึง มือถึง ทีมถึง ใจถึง บุญถึง” งดงามมาก สามข้อหลัง (ทีม ใจ บุญ) คือกระดานคะแนนภายในที่จะอยู่กับเธอตอนนาทีสุดท้าย สองข้อแรกเป็นแค่เครื่องมือ อย่าให้เครื่องมือมาเป็นนาย'],
  quote:'ความสำเร็จที่แท้จริงวัดง่ายนิดเดียว — เมื่อถึงวัยผม คนที่เธออยากให้รักเธอ เขารักเธอจริงๆ ไหม เธอเขียนเองแล้วว่า “อยากให้พี่ต้นรักมากๆ” นั่นแหละคำตอบ ไม่ใช่เลข 500 ล้าน และเธอเริ่มสะสมได้ตั้งแต่คืนนี้'},

 {id:'boonchai',
  lens:'คุณจิ้นกำลังนั่งนับเหรียญอยู่ในห้อง ทั้งที่ประตูข้างนอกเปิดออกสู่การสร้าง “แผ่นดิน” ของตัวเองได้แล้ว — คนคิดใหญ่ไม่ได้ดูยอดเงิน เขาดูว่าอีกห้าสิบปีจะมีใครยังเอ่ยชื่อเราด้วยความเคารพ',
  affirm:[
   '“อยาก fulfill มากกว่า achievement” คือหัวใจของคนที่จะอยู่ยาว ผมขายหุ้นบริษัทไปแล้วเงินก็พอ แต่สิ่งที่ตื่นมาทำทุกเช้าคือพิพิธภัณฑ์ คือการคืนของให้แผ่นดิน — achievement จบที่ตัวเรา แต่ fulfillment ไปต่อได้',
   'ภาพ “ชุมชนพิษณุโลก” ไม่ใช่ฝันเล็กๆ คนทั่วไปฝันมีบ้านใหญ่ คุณจิ้นฝันให้คนทั้งชุมชนมีข้าวกิน — เงินซื้อความภูมิใจแบบนี้ไม่ได้',
   'พรสวรรค์ “ย่อยเรื่องยากแล้วถ่ายทอด” หายาก คนเก่งมีเยอะ แต่คนเก่งที่ “สอนให้คนอื่นเก่งตาม” ได้น้อยมาก คือเครื่องมือสร้างมรดกที่ทรงพลัง เพราะคูณตัวเองข้ามรุ่นได้'],
  challenge:[
   '“500 ล้าน แค่ชอบเลขนี้” + “เบื่ออิจฉาเปรียบเทียบ” — ตัวเลขคือกับดัก คนตั้งเป้าเป็นตัวเลขจะมองซ้ายขวาว่าใครได้มากกว่าเสมอ แต่คนตั้งเป้าเป็น “ผลงานต่อแผ่นดิน” ไม่มีคู่แข่ง เพราะไม่มีใครสร้างชุมชนของคุณจิ้นได้นอกจากคุณจิ้น',
   '“อยากเขียนหนังสือ แต่ไม่กล้าแมส กลัวเสียพื้นที่ส่วนตัว” — กำลังสับสนสองเรื่องเป็นเรื่องเดียว “ความเป็นส่วนตัว” กับ “การให้ความรู้ถึงคนหมู่มาก” แยกกันได้ ผมเองก็เงียบ ไม่เล่นโซเชียล แต่พิพิธภัณฑ์เปิดให้คนเป็นแสนเข้าชม',
   'ถ้าของดีที่มี — วิธีย่อยเรื่องยาก หัวใจการให้ — ไม่ไปถึงคนที่ต้องการ เพราะกลัวเสียพื้นที่ส่วนตัว นั่นคือการเก็บของดีไว้ใต้ฐาน คนมีของมีหน้าที่ครับ — หน้าที่ส่งของนั้นออกไป'],
  advice:[
   'อย่าคิดเป็น “โครงการ” คิดเป็น “สถาบันที่มีชีวิต” — มัดชุมชน+การกุศล+การสอน เป็นมูลนิธิหรือกิจการเพื่อสังคมที่มีชื่อ มีกฎ มีคนสืบทอด ถามข้อเดียว “ถ้าวันหนึ่งฉันไม่อยู่ สิ่งนี้เดินต่อเองได้ไหม”',
   'เริ่มจากหมุดเล็กที่จับต้องได้ อย่ารอครบ 500 ล้าน — ปีนี้เลือกหนึ่งอย่างที่พิษณุโลก ศูนย์เรียนรู้เล็กๆ หรือทุนการศึกษา 5 คนที่เลือกเอง วิสัยทัศน์ใหญ่ต้องมีหมุดแรกปักลงดินจริง',
   'การถ่ายทอด เริ่มแบบที่รักษาพื้นที่ส่วนตัวได้ก่อน — เขียนหนังสือสักเล่ม หรือสอนวงเล็กที่คัดเอง ไม่ต้องเป็นดารา แค่เป็น “ครู” หนังสือทำงานแทนเราได้ 20 ปีโดยไม่ต้องออกหน้า นั่นคือการแมสแบบคนเงียบ'],
  quote:'เงินที่หามาได้ บอกว่าเราเก่งแค่ไหน — แต่สิ่งที่เราสร้างทิ้งไว้ให้แผ่นดิน บอกว่าเราเป็นใคร คุณจิ้นมีของพอจะเป็นคนที่แผ่นดินจดจำแล้ว เหลือแค่กล้าเลิกนับเหรียญ แล้วลงมือสร้าง'},

 {id:'supaluck',
  lens:'ฉันมองคนผ่านแว่นเดียวกับที่มองพื้นที่ว่าง — คุณจิ้นไม่ได้อยากครอบครองของหรู เธอกำลังจะกลายเป็น “ผู้สร้างที่ที่คนอยากมา” ซึ่งลึกกว่าการช้อปปิ้งหลายเท่า',
  affirm:[
   'ความฝัน “ชุมชนพิษณุโลก — ตลาด วัด บ้าน สวน ที่ให้คนมีงานทำ” นี่แหละคือความคิดของนักสร้าง destination ตัวจริง เธอไม่ได้อยากสร้างตึก เธออยากสร้าง “ชีวิตของย่าน” — หัวใจแบบนี้สอนกันไม่ได้ ต้องมีมาเอง',
   'การเลือก “fulfill มากกว่า achievement” และ “เบื่อจะอิจฉาเปรียบเทียบ” คือสัญญาณว่าเธอโตพอจะเข้าใจแล้วว่า ความพิเศษที่แท้ไม่ได้อยู่ที่เรา “มี” อะไร แต่อยู่ที่เรา “ทำให้คนอื่นรู้สึก” อะไร',
   'รสนิยมเธอดีจริง — คนที่ละเอียดอ่อนกับความงามแบบนี้ คือคนที่จะคุมดีเทลของ “พื้นที่” ให้ถึงระดับโลกได้ ฉันเชื่อในคนที่มีตา'],
  challenge:[
   '“feel extraordinary” ผ่านการสะสมแบรนด์เนม เพชรนิลจินดา — มันอิ่มได้แค่ชั่วครู่ เพราะของมันนิ่ง มันไม่ตอบเรากลับ ลองถามตรงๆ ว่าวันที่ใส่เพชรงามที่สุด พิเศษกว่าวันที่เห็นแม่ค้าในตลาดของเธอขายหมดเกลี้ยงแล้วยิ้มจริงไหม',
   'ความฝันพิษณุโลกยังเป็น “ความตั้งใจดี” ที่ยังไม่มีรูปร่าง — ใจบุญอย่างเดียวสร้าง destination ไม่ได้ ตลาดที่ไร้การออกแบบก็เป็นแค่ที่ขายของ มันจะเป็น “ที่ที่คนต้องมา” ได้ต่อเมื่อมีดีเทล มีเรื่องเล่า มีประสบการณ์ที่คนจำได้',
   'ระวังคำว่า “มหาราณีผู้ใจบุญ” — การให้จากที่สูงลงมา กับการสร้างที่ที่คนยืนได้ด้วยตัวเอง คนละเรื่องกัน อย่างหลังยากกว่า แต่ยั่งยืนและมีเกียรติกับเขามากกว่า'],
  advice:[
   'เริ่มจากคำถามที่ฉันถามก่อนเปิดที่ใหม่ทุกครั้ง “คนจะรู้สึกอะไรตอนเดินเข้ามา?” — เดินตลาดพิษณุโลกในจินตนาการ ตั้งแต่ที่จอดรถ กลิ่น แสง เสียง รอยยิ้มคนต้อนรับ จนถึงของที่หิ้วกลับบ้าน ออกแบบ “ความรู้สึก” ก่อนออกแบบอาคาร แล้วพรสวรรค์ “ย่อยเรื่องยากให้ง่าย” ของเธอจะมีที่ลง',
   'เอาความหรูที่เธอรัก มาเป็น “มาตรฐาน” ไม่ใช่ “ของส่วนตัว” — ยกบริการ ความสะอาด การจัดวาง เรื่องเล่าของแม่ค้าแต่ละเจ้า ให้ถึงระดับที่เธอเองยังประทับใจ นั่นคือการแปลง “อยากพิเศษ” เป็น “ทำให้คนอื่นได้สัมผัสความพิเศษ” แล้วเธอจะ feel extraordinary ทุกวันโดยไม่ต้องซื้ออะไรเลย',
   'ทำ “ที่เดียวให้สุด” ก่อน อย่ากระจาย — ร้านเดียว มุมเดียว ตลาดวันเดียวในสัปดาห์ก็ได้ ทำให้ดีจนคนเล่าต่อ แล้วค่อยขยาย · destination ที่ยิ่งใหญ่สร้างจากดีเทลที่ไม่ยอมปล่อยทีละจุด'],
  quote:'ลูกเอ๊ย — ความหรูที่ไม่มีหัวใจคือความว่างเปล่า แต่หัวใจที่มีรสนิยมและไม่ยอมปล่อยดีเทล นั่นแหละจะเปลี่ยนตลาดเล็กๆ ในพิษณุโลกให้เป็นที่ที่คนทั้งจังหวัดอยากกลับมา'},

 {id:'jun',
  lens:'พี่มองน้องผ่านแว่นผู้หญิงที่สร้างอาณาจักรจากศูนย์ — ของจริงไม่ได้วัดที่ทำเองเก่งแค่ไหน แต่วัดที่ “สร้างระบบให้มันเดินแทนเราได้ไหม” และ “ใจนิ่งพอจะตัดสินใจไหม”',
  affirm:[
   'น้องมีไฟแบบผู้สร้างอาณาจักรของแท้ — “dot to dot จนสร้าง empire” คือ mindset ที่พี่เดินมาทั้งชีวิต ผู้หญิงสร้างอาณาจักรได้จริง ขอแค่กล้าเรียนกล้าตัดสินใจ น้องมีครบ',
   '“บ้าการเรียนรู้” คือสมบัติที่แพงที่สุด พี่อ่านหนักทุกวันจนวันนี้ คนที่ upgrade ตัวเองไม่หยุดเท่านั้นที่ไม่ถูกโลก disrupt',
   'น้องรู้ตัวว่าอยาก “fulfill มากกว่า achievement” — ข้อนี้ลึกและถูกทาง คนที่ผ่านยอดเขามาหลายลูกถึงมองออก น้องมองออกก่อนถึงยอด ดีมาก'],
  challenge:[
   'น้องบอกอยาก leverage แต่ยัง “เป็นคนทำจริง” ทำเองเยอะ — สองอย่างนี้ขัดกัน ถ้าน้องยังเป็นคอขวดของทุกเรื่อง empire จะไม่มีวัน “ไม่ยุ่งยาก” อย่างที่ฝัน ถามตรงๆ “ถ้าวันนี้น้องหายไป มันเดินต่อเองได้ไหม?”',
   'กับดักเปรียบเทียบ-อิจฉานั่นแหละที่กินพลังจนลังเล “ฐานครบแต่ level ไม่พอ” — มันไม่เคยพอถ้าวัดด้วยสายตาคนอื่น คนที่มองข้างๆ ตลอดจะไม่กล้าตัดสินใจ เพราะมัวรอดูว่าคนอื่นทำอะไร',
   '“ตาหลักแหลมมองขาด” เกิดไม่ได้ถ้าใจไม่นิ่ง — ความลังเลกับวิสัยทัศน์อยู่ในตัวเดียวกันไม่ได้'],
  advice:[
   'ตั้งเป้าพอร์ต 300-500 ล้านเป็นหมุดปลายทาง แล้วถอยหลังแตกเป็นเป้ารายปี-รายไตรมาส ผูกตัวเลขจริงทุกขั้น — ตั้ง “ปลดหนี้” เป็น milestone แรกที่มีวันชัดเจน วินัยการเงินคือฐานของอิสรภาพ',
   'เลือก “1 เรื่องที่น้องทำเองอยู่ตอนนี้” แล้วสร้างระบบ/คนมารับใน 90 วัน วางทีละชิ้นจนมือว่างไปทำเรื่องที่ leverage ได้จริง — อย่าทำงานหนักอย่างเดียว วางระบบให้มันทำงานแทนเรา',
   'ทุกครั้งที่จับได้ว่ากำลังเปรียบเทียบ ให้ถามว่า “วันนี้ฉันเก่งกว่าฉันเมื่อวานไหม” — วัดกับตัวเองเท่านั้น แล้วเอาพลังที่เคยเสียกับการอิจฉ ามาลงที่ชุมชนพิษณุโลก'],
  quote:'น้องจิ้น ล้มได้ แต่ต้องลุกให้เร็วกว่าเดิม — แล้วอย่ามัวเทียบกับใคร เพราะคนที่กำลังเดินขึ้นภูเขาลูกของตัวเอง ไม่มีเวลามองว่าคนอื่นปีนอยู่ตรงไหน'},

 {id:'luangpor',
  lens:'ลูกเอ๋ย ทุกสิ่งที่ลูกตามหา — ความพิเศษ ความสำเร็จ ความสุข — มันไม่ได้อยู่ข้างนอกหรอก มันอยู่ในใจที่หยุดนิ่งของลูกนี่เอง',
  affirm:[
   'ใจของลูกมีบุญเป็นทุนเดิม — ลูกอยากทำทาน อยากภาวนา อยากเข้าถึงพระธรรมกาย นั่นคือใจที่หันหน้าเข้าหาแสงสว่างแล้ว หลวงพ่ออนุโมทนาบุญด้วย',
   'ลูกรู้สึกตัวเองแล้วว่า “เบื่อจะอิจฉา เบื่อจะเปรียบเทียบ ไม่ชอบความรู้สึกนั้นเลย” — การที่ใจรู้ทันความทุกข์ของตัวเอง คือก้าวแรกที่ประเสริฐที่สุด คนส่วนใหญ่ยังไม่รู้ตัวด้วยซ้ำ',
   'ลูกบอกอยาก “fulfill มากกว่า achievement” — ลึกๆ ใจลูกรู้คำตอบอยู่แล้วว่าความเต็มที่แท้จริงไม่ได้มาจากการไขว่คว้า ลูกแค่ยังไม่ได้ให้เวลามันพักนิ่งๆ'],
  challenge:[
   'ลูกเขียนว่า “ชอบอยู่เหนือคนอื่น ชอบชนะ ชอบเป็นที่หนึ่ง” — หลวงพ่อไม่ได้ว่านะ แต่ลองสังเกตว่าใจที่ต้องเอาชนะคนอื่นเสมอ คือใจที่วิ่งออกไปข้างนอกไม่หยุด มันจะเหนื่อย เพราะมีคนเก่งกว่าเสมอ และความเป็นที่หนึ่งก็ไม่เคยอยู่ถาวร',
   'เลข 500 ล้าน ความ extraordinary — ไม่ผิดเลยลูก แต่ถ้าวางมันเป็น “ปลายทาง” ใจจะไม่มีวันถึงพอ เพราะตัณหามันต่อยอดไปเรื่อยๆ ความพิเศษที่ลูกตามหา จริงๆ รออยู่ในความสว่างภายในที่ไม่ต้องแข่งกับใคร',

function useReveal(){
  useEffect(()=>{
    const els=document.querySelectorAll('[data-reveal]');
    els.forEach(el=>el.classList.add('pre-reveal'));
    if(!('IntersectionObserver' in window)){els.forEach(el=>{el.classList.remove('pre-reveal');el.classList.add('reveal-in')});return;}
    const io=new IntersectionObserver((ents)=>{
      ents.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('pre-reveal');e.target.classList.add('reveal-in');io.unobserve(e.target);}});
    },{threshold:.12});
    els.forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  },[]);
}

  return <div className="avatar" title={m.name} style={{width:size,height:size,fontSize:size*0.5,background:'linear-gradient(135deg,'+m.accent+'33,'+m.accent+'14)',border:'1.5px solid '+m.accent+'55'}}>{m.emoji}</div>;
}

function Nav(){
  const [act,setAct]=useState('overview');
  useEffect(()=>{
    const io=new IntersectionObserver((ents)=>{
      ents.forEach(e=>{if(e.isIntersecting)setAct(e.target.id)});
    },{rootMargin:'-45% 0px -50% 0px'});
    SECTIONS.forEach(s=>{const el=document.getElementById(s.id); if(el)io.observe(el);});
    return ()=>io.disconnect();
  },[]);
  const go=(id)=>{const el=document.getElementById(id); if(el)el.scrollIntoView({behavior:'smooth',block:'start'});};
  return (
   <div className="nav">
     <div style={{maxWidth:1120,margin:'0 auto'}} className="px-4 py-2.5 flex items-center gap-2">
       <div className="flex items-center gap-2 mr-2 flex-none">
         <span style={{fontSize:20}}>🪷</span>
         <span className="serif font-semibold hidden sm:block" style={{color:'var(--head)'}}>Joyce&nbsp;Workshop</span>
       </div>
       <div className="flex items-center gap-1 overflow-x-auto" style={{scrollbarWidth:'none'}}>
         {SECTIONS.map(s=>(
           <span key={s.id} onClick={()=>go(s.id)} className={'navlink '+(act===s.id?'active':'')}>{s.label}</span>
         ))}
       </div>
     </div>
   </div>
  );
}

           <p className="mt-4 text-sm" style={{color:'var(--ink)'}}>= ยกระดับ UP Wellness จาก “ธุรกิจสุขภาพ” เป็น <b style={{color:'var(--teal)'}}>“โรงเรียนและชุมชนแห่งการมีชีวิตที่ดีและยืนยาว ที่สร้างอาชีพให้คน โดยมีบุญเป็นแก่น”</b></p>
         </div>
         <div data-reveal className="glass p-7" style={{borderTop:'3px solid var(--rose)'}}>
           <div className="serif" style={{fontSize:21,fontWeight:700,color:'var(--head)'}}>💗 เติมเต็มด้านไหน · ด้วยอะไร</div>
           <p className="mt-3 text-sm" style={{color:'var(--ink)'}}>
             เติมเต็มแบบ <b style={{color:'var(--rose)'}}>“ผู้ให้และผู้สร้างมรดก”</b> และ <b style={{color:'var(--lav)'}}>“อยู่เหนือการเปรียบเทียบ”</b> — ด้วยพรสวรรค์การสอน + ความน่าเชื่อถือของวิชาชีพเภสัชกร + ระบบ/AI ของสามีช่วยทุ่นแรง + การปฏิบัติธรรมเป็นตัวตั้งหลัก + การเปลี่ยน “ความอยากพิเศษ” ให้กลายเป็น “การยกคนอื่นขึ้น”
           </p>
         </div>
       </div>
     </div>
   </section>
  );
}

function Actions(){
  const [done,setDone]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('joyce_actions')||'{}')}catch(e){return {}}
  });
  const toggle=(i)=>{const n={...done,[i]:!done[i]}; setDone(n); try{localStorage.setItem('joyce_actions',JSON.stringify(n))}catch(e){}};
  const count=ACTIONS.filter((_,i)=>done[i]).length;
  return (
   <section id="actions" className="px-4 py-12" style={{maxWidth:1120,margin:'0 auto'}}>
     <SectionTitle eyebrow="ลงมือทำได้เลย" title="สิ่งที่ควรทำต่อ — พร้อมผู้รับผิดชอบและช่วงเวลา" desc="เริ่มจากเล็กๆ ที่ทำได้คืนนี้ ไปจนถึงงานชิ้นเอกของปีนี้ · ติ๊กเพื่อเก็บความคืบหน้า (บันทึกในเครื่องนี้)"/>
     <div data-reveal className="glass p-4 mb-4 flex items-center gap-3 noprint">
       <div className="bar flex-1" style={{position:'relative',height:8}}>
         <div style={{position:'absolute',inset:0,width:(count/ACTIONS.length*100)+'%',borderRadius:999,background:'linear-gradient(90deg,var(--lav),var(--rose))',transition:'.4s'}}></div>
         <div style={{position:'absolute',inset:0,borderRadius:999,background:'rgba(150,131,204,.18)',zIndex:-1}}></div>
       </div>
       <div className="text-sm font-semibold flex-none" style={{color:'var(--head)'}}>{count}/{ACTIONS.length} ทำแล้ว</div>
     </div>
     <div className="flex flex-col gap-3">
       {ACTIONS.map((a,i)=>(
         <div key={i} data-reveal className="glass p-4 sm:p-5 flex items-start gap-4" style={{opacity:done[i]?.6:1,transition:'.3s'}}>
           <input type="checkbox" className="check mt-0.5" checked={!!done[i]} onChange={()=>toggle(i)}/>
           <div className="flex-1">
             <div className="flex flex-wrap items-center gap-2 mb-1.5">
               <span className="owner" style={{background:a.col+'22',color:a.col}}>{a.who}</span>
               <span className="text-xs" style={{color:'var(--ink-faint)'}}>⏱ {a.when}</span>
             </div>
             <div className="text-sm" style={{color:'var(--ink)',textDecoration:done[i]?'line-through':'none'}}>{a.t}</div>
           </div>
         </div>
       ))}
     </div>

     <div data-reveal className="glass p-7 mt-7 text-center" style={{background:'linear-gradient(140deg,rgba(213,133,160,.13),rgba(150,131,204,.11))'}}>
       <div style={{fontSize:30}}>🫶🏻</div>
       <p className="mali mt-2" style={{fontSize:'clamp(17px,2.5vw,21px)',color:'var(--head)',maxWidth:680,margin:'8px auto 0'}}>
         “จิ้นไม่ได้ไม่มีความดีเลยน้า… จิ้นมีเยอะจนลืมนับ — แค่หยุดเปรียบเทียบกับคนอื่น แล้วหันไปกอดคนที่รอกินขนมกับเรา ก็สำเร็จแล้วล่ะค่า”
       </p>
       <button onClick={()=>window.print()} className="noprint mt-6 px-5 py-2.5 rounded-full font-semibold text-sm" style={{color:'#fff',background:'linear-gradient(120deg,var(--lav),var(--rose))',border:'none',cursor:'pointer',boxShadow:'0 8px 20px -8px rgba(150,110,180,.6)'}}>🖨 พิมพ์ / บันทึกเป็น PDF</button>
     </div>

     <div className="text-center mt-10" style={{color:'var(--ink-faint)',fontSize:13}}>
       วิเคราะห์ด้วยความรัก · ทีมนักจิตวิทยา + คณะผู้ทรงคุณวุฒิจาก Agent Persona DB<br/>จัดทำให้ <b style={{color:'var(--rose)'}}>จิ้น</b> โดย <b style={{color:'var(--sky)'}}>พี่ต้น</b> · 14 มิถุนายน 2569
     </div>
   </section>
  );
}

function applyTheme(t){
  var d = t==='dark' || (t==='system' && window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.setAttribute('data-theme', d?'dark':'light');
}
function Controls({theme,setTheme,fs,setFs}){
  const opts=[['light','☀️','สว่าง'],['dark','🌙','มืด'],['system','🖥️','ตามระบบ']];
  return (
   <div className="controls glass noprint">
     <div className="ctitle">ธีม</div>
     <div className="crow">
       {opts.map(([k,ic,lb])=>(<button key={k} className={'cbtn'+(theme===k?' on':'')} title={lb} onClick={()=>setTheme(k)}>{ic}</button>))}
     </div>
     <div className="ctitle">ขนาดตัวอักษร</div>
     <div className="crow">
       <button className="cbtn" title="เล็กลง" onClick={()=>setFs(Math.max(0.85,+(fs-0.1).toFixed(2)))}>ก−</button>
       <button className="cbtn" title="ปกติ" onClick={()=>setFs(1)}>ก</button>
       <button className="cbtn" title="ใหญ่ขึ้น" onClick={()=>setFs(Math.min(1.45,+(fs+0.1).toFixed(2)))}>ก+</button>
     </div>
   </div>
  );
}
function App(){
  useReveal();
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem('joyce_theme')||'system'}catch(e){return 'system'}});
  const [fs,setFs]=useState(()=>{try{return parseFloat(localStorage.getItem('joyce_fs'))||1}catch(e){return 1}});
  useEffect(()=>{
    applyTheme(theme); try{localStorage.setItem('joyce_theme',theme)}catch(e){}
    if(theme==='system' && window.matchMedia){
      const mq=window.matchMedia('(prefers-color-scheme:dark)'); const h=()=>applyTheme('system');
      mq.addEventListener('change',h); return ()=>mq.removeEventListener('change',h);
    }
  },[theme]);
  useEffect(()=>{ try{localStorage.setItem('joyce_fs',String(fs))}catch(e){} },[fs]);
  return (
   <div>
     <Nav/>
     <div style={{zoom:fs}}>
       <Hero/>
       <Overview/>
       <Questions/>
       <Analysis/>
       <MindMap/>
       <Panel/>
       <Synthesis/>
       <Actions/>
       <div style={{height:40}}></div>
     </div>
     <Controls theme={theme} setTheme={setTheme} fs={fs} setFs={setFs}/>
   </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
