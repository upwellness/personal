    <h2 className="display anim font-bold text-[30px] mb-4">🔎 เคส 2 — เพื่อนของเพื่อน "ชอบขายของ"</h2>
    <div className="glass-2 anim-2 rounded-2xl p-5 mb-3"><div className="text-[13px] uppercase tracking-widest text-[var(--faint)] mb-2">สิ่งที่ได้ยิน</div>
      <div className="text-[16px] text-[#dde3ff]">ทำงานเยอะ หยุดไม่ได้ · ถามทำไม → "ชอบขายของ" · ต้นถาม <b className="hl-amber">"ถ้ามีเงินล้าน/เดือน จะยังขายไหม?"</b></div></div>
    <div className="text-[13px] uppercase tracking-widest text-[var(--faint)] mb-2">อ่าน (มี 3 ทาง — อย่าฟันธงทางเดียว)</div>
    <div className="flex flex-col gap-3 mb-3">{reads.map((r,i)=>(
      <div key={i} className="glass anim-2 rounded-2xl px-5 py-3.5"><b style={{color:r.c}} className="text-[16px]">{r.t}:</b> <span className="text-[15px] text-[#dde3ff]">{r.d}</span></div>))}</div>
    <div className="glass-2 anim-3 rounded-2xl p-4 mb-2.5"><b className="text-[var(--cyan)]">เช็ก:</b> <span className="text-[14.5px] text-[#c9d1f5]">"ถ้าเงินไม่ใช่ปัญหา อยากทำอะไร / การขายให้อะไรมากที่สุด (เงิน/สนุก/เจอคน/รู้สึกเก่ง)"</span></div>
    <div className="text-[13.5px] italic" style={{color:"#fcd34d"}}>⚠️ คำถาม "ถ้ามีเงินล้าน…" เป็นแค่เครื่องช่วยเปิดบทสนทนา ไม่ใช่เครื่องตัดสินขาด — คำตอบสมมติเชื่อ 100% ไม่ได้ ต้องดูพฤติกรรมจริงประกอบ</div>
  </div>);}

function Case3a(){return(<div className="safe">
  <h2 className="display anim font-bold text-[28px] mb-3">⭐ เคส 3 — "พี่แอน ที่ดูมีทุกอย่างแล้ว" (เคสที่มักอ่านผิด)</h2>
  <div className="glass-2 anim rounded-xl px-5 py-3 mb-3"><b className="text-[var(--faint)]">โปรไฟล์:</b> <span className="text-[15px] text-[#dde3ff]">ผู้หญิง ~45 สามีธุรกิจดี ลูกโตเข้ามหาลัยหมด ชีวิตสบาย เพื่อนชวนมางาน</span></div>
  <div className="grid grid-cols-2 gap-3 mb-3">
    <div className="glass anim-2 rounded-2xl p-4"><div className="text-[12px] uppercase tracking-widest text-[var(--faint)] mb-1.5">เปิดตัว</div><div className="text-[16px] italic">"มาดูเฉยๆ นะ ไม่ได้อยากได้อะไร พี่ไม่ได้เดือดร้อนเรื่องเงิน"</div></div>
    <div className="glass anim-2 rounded-2xl p-4"><div className="text-[12px] uppercase tracking-widest text-[var(--faint)] mb-1.5">พูดซ้ำระหว่างคุย</div><div className="text-[15px] italic">"อยู่บ้านก็เบื่อ ลูกโตแล้ว ไม่รู้จะทำอะไร" · "เมื่อก่อนทำแบงค์ พอออกมาเลี้ยงลูกก็หายไปเลย"</div></div>
  </div>
  <div className="glass-2 anim-3 rounded-2xl p-4 mb-3"><b style={{color:"#fb7185"}}>❌ พลาดที่พบบ่อย:</b> <span className="text-[15px] text-[#dde3ff]">sponsor มือใหม่ได้ยิน "ไม่เดือดร้อนเงิน" แล้วตัดทิ้ง ("พี่รวยแล้ว ไม่ใช่ลูกค้า")</span></div>
  <div className="glass anim-3 rounded-2xl p-4"><b style={{color:"#34d399"}}>✅ อ่านจริง:</b> <span className="text-[15px] text-[#dde3ff]">เขาไม่หิวเงิน (ตัด 1–2) — แต่หิว <b>ระดับ 3 (เหงา ลูกโต หมดบทบาท)</b> + <b>ระดับ 4 (อยากมีตัวตน ไม่ใช่แค่ "เมียของ…" "แม่ของ…")</b> — คนหิว 2 ระดับพร้อมกันได้</span>
    <div className="mt-2 text-[13px] italic" style={{color:"#fcd34d"}}>💡 ตัด 1–2 ได้เพราะหลักฐานแวดล้อมสอดคล้อง (สามีธุรกิจดี + ไม่บ่นเรื่องเงินซ้ำเลย) ไม่ใช่จากคำเดียว</div></div>
</div>);}

function Case3b(){const rows=[
  {say:"\"มาดูเฉยๆ ไม่อยากได้อะไร\" (ครั้งแรก)",mean:"อาจเป็นกำแพงมารยาท",move:"\"ได้เลยพี่ ไม่ต้องรีบ มาทำความรู้จักกันก่อน\" — แต่ถ้าพูดซ้ำ 2–3 ครั้ง = คำตอบจริง ต้องเคารพ ไม่ดันต่อ"},
  {say:"\"พี่ไม่เดือดร้อนเรื่องเงิน\"",mean:"ตัดระดับ 1–2",move:"\"ขอถามอีกมุม — ช่วงนี้ว่างๆ พี่ทำอะไรบ้าง\" (เบนไปสังคม)"},
  {say:"\"อยู่บ้านเบื่อ ลูกโตแล้ว\"",mean:"ระดับ 3",move:"\"หลายพี่พอลูกโตก็รู้สึกแบบนี้ ที่นี่มีกลุ่มเจอกันประจำ\" (เสนอสังคม)"},
  {say:"\"เมื่อก่อนทำแบงค์ ออกมาก็หายไป\"",mean:"ระดับ 4",move:"\"ฟังแล้วรู้เลยพี่เคยเก่งมาก่อน ที่นี่มีเวทีให้ได้เป็นตัวเองอีกครั้ง\" (คืนตัวตน)"}];
  return(<div className="safe">
    <h2 className="display anim font-bold text-[26px] mb-3">⭐ พี่แอน — ตาราง เขาพูด → ระดับ → เราพูดต่อ</h2>
    <div className="anim-2 flex flex-col gap-2 mb-3">{rows.map((r,i)=>(
      <div key={i} className="glass-2 rounded-xl px-4 py-2.5 flex items-center gap-3">
        <div className="w-[280px] text-[13px] text-[#dde3ff]">"{r.say}"</div>
        <div className="w-[95px] text-[12.5px] font-bold" style={{color:"#fcd34d"}}>{r.mean}</div>
        <div className="flex-1 text-[12.5px] text-[#c9d1f5]">{r.move}</div>
      </div>))}</div>
    <div className="grid grid-cols-2 gap-3">
      <div className="glass anim-3 rounded-2xl p-4"><b className="hl-green">บทเรียน:</b> <span className="text-[14px] text-[#dde3ff]">อย่าตัด "คนรวยแล้ว/บอกไม่เอา" ทิ้ง — เขาไม่หิวเงิน แต่หิว สังคม + ตัวตน ซึ่งธุรกิจนี้ให้ได้เต็มๆ</span></div>
      <div className="glass-2 anim-3 rounded-2xl p-4"><b className="text-[var(--cyan)]">→ จบวันนี้แค่นี้:</b> <span className="text-[14px] text-[#dde3ff]">ชวนเข้ากลุ่ม (ระดับ 3) ก่อน ยังไม่ขายของ/ไม่พูดเงิน — ให้พี่แอนเลือกก้าวต่อเอง</span></div>
    </div>
  </div>);}

function RolePlay(){const lines=[
  {who:"เรา",t:"พี่แอน วันนี้ดีใจที่มานะครับ ไม่ต้องรีบอะไรเลย มาทำความรู้จักกันก่อน",tag:null},
  {who:"พี่แอน",t:"อือ พี่มาดูเฉยๆ นะ ไม่ได้อยากได้อะไร พี่ไม่ได้เดือดร้อนเรื่องเงิน",tag:null},
  {who:"เรา",t:"เข้าใจเลยครับ ขอถามอีกมุม — ช่วงนี้ว่างๆ พี่ทำอะไรบ้างครับ",tag:null},
  {who:"พี่แอน",t:"ก็…อยู่บ้านนี่แหละ ลูกโตเข้ามหาลัยหมดแล้ว บางทีก็เบื่อ ไม่รู้จะทำอะไร",tag:"ระดับ 3"},
  {who:"เรา",t:"ได้ยินหลายพี่พูดแบบนี้เลย พอลูกโต บ้านมันเงียบลง… เมื่อก่อนพี่ทำงานอะไรครับ",tag:null},
  {who:"พี่แอน",t:"เมื่อก่อนพี่ทำแบงค์ ตำแหน่งดีนะ แต่พอมีลูกก็ออกมาเลี้ยงลูก…หายไปเลย",tag:"ระดับ 4"},
  {who:"เรา",t:"ฟังแล้วรู้เลยว่าพี่เก่งมาก่อน… ที่นี่มีหลายพี่กลับมาเจอ 'ตัวเอง' อีกครั้ง ไม่ใช่ในฐานะแม่ใครเมียใคร",tag:null},
  {who:"พี่แอน",t:"…จริงเหรอ แต่พี่ไม่ได้ทำอะไรมานานแล้ว จะทำได้ไหม",tag:"ระดับ 4 กลัวไม่เก่งพอ"},
  {who:"เรา",t:"เริ่มจากมาร่วมกลุ่มก่อนก็ได้ มีทีมช่วยตั้งแต่ต้น ลองมางานหน้าดูก่อนไหม",tag:null},
  {who:"พี่แอน",t:"อืม…แบบนั้นก็ดีนะ",tag:null}];
  return(<div className="safe">
    <h2 className="display anim font-bold text-[26px] mb-2.5">🎭 Role Play เต็ม — จำลองบทสนทนา</h2>
    <div className="flex flex-col gap-1.5">{lines.map((l,i)=>{const us=l.who==="เรา";return(
      <div key={i} className="anim flex items-center gap-2.5">
        <div className="w-[58px] text-[12px] font-bold flex-none" style={{color:us?"#22d3ee":"#fbbf24"}}>{l.who}</div>
        <div className={"rounded-lg px-3.5 py-1.5 flex-1 text-[13px] "+(us?"glass-2":"glass")} style={{color:"#e7ebff"}}>{l.t}</div>
        {l.tag&&<div className="flex-none text-[10.5px] font-bold px-2.5 py-1 rounded-md" style={{background:"rgba(52,211,153,.16)",color:"#34d399",border:"1px solid rgba(52,211,153,.4)"}}>{l.tag}</div>}
      </div>);})}</div>
    <div className="mt-3 text-[14px] font-bold" style={{color:"#22d3ee"}}>→ จบวันนี้แค่นี้: ชวนเข้ากลุ่ม (ระดับ 3) ก่อน · ยังไม่ขายของ/ไม่พูดเงิน · ให้พี่แอนเลือกก้าวต่อเอง</div>
  </div>);}

function Rules(){const items=[
  {t:"คำแรก = ภาพ ไม่ใช่แรงจริง",d:"ฟังต่อเสมอ"},
  {t:"จับ \"คำที่บ่นก่อน\" + \"คำที่พูดซ้ำ\"",d:"= ระดับที่หิวจริง"},
  {t:"เทสต์ \"ถ้า…จะยังทำไหม\"",d:"แต่เป็นแค่เครื่องเปิดบทสนทนา ไม่ใช่คำตัดสิน"},
  {t:"ปิดช่องที่ \"หิวตอนนี้\" ก่อน",d:"อย่าขายปลายทางให้คนติดฐานล่าง"},
  {t:"เชื่อพฤติกรรม/น้ำเสียง มากกว่าคำพูด",d:"เมื่อมันขัดกัน"},
  {t:"ไม่ชัวร์ = ถามต่อ ไม่เดาเหมา",d:"RADAR = สมมติฐาน ไม่ใช่คำตัดสิน"},
  {t:"คนหิวได้หลายระดับพร้อมกัน",d:"เลือกช่องที่ \"ดังสุด\" ช่องเดียวก่อน"},
  {t:"กลับไปอ่านกติกาเหล็ก 2 ข้อเสมอ",d:"ฟังเพื่อช่วย · เช็คใจตัวเองก่อนนัด"}];
  return(<div className="safe flex flex-col justify-center">
    <h2 className="display anim font-bold text-[32px] mb-5">✅ กติกาการฟัง (สรุป) — <span className="hl">8 ข้อ จำไปใช้เลย</span></h2>
    <div className="grid grid-cols-2 gap-3">{items.map((r,i)=>(
      <div key={i} className={"anim-2 rounded-xl px-5 py-3.5 flex items-center gap-4 "+(i>=6?"glass":"glass-2")}>
        <Badge n={i+1} c={i>=6?"#fb7185":"#a78bfa"} size={40} fs={15}/>
        <div className="flex-1"><span className="font-semibold text-[15.5px]">{r.t}</span><span className="text-[13.5px] text-[var(--muted)]"> — {r.d}</span></div>
      </div>))}</div>
    <div className="glass anim-3 mt-5 rounded-2xl px-6 py-3.5 text-center text-[17px] font-bold">💚 ฟังก่อนขาย — framework นี้เป็น<span className="hl">เครื่องมือฟัง</span> ไม่ใช่เครื่องมือกดจุดอ่อนคน</div>
  </div>);}

function Body({s}){switch(s.k){
  case "cover":return <Cover/>;case "core":return <Core/>;case "ethics":return <Ethics/>;
  case "form":return <Form/>;case "radar":return <Radar/>;case "level":return <Level lv={s.lv}/>;
  case "bridge":return <Bridge/>;case "mapping":return <Mapping/>;case "case1":return <Case1/>;
  case "case2":return <Case2/>;case "case3a":return <Case3a/>;case "case3b":return <Case3b/>;
  case "roleplay":return <RolePlay/>;case "rules":return <Rules/>;default:return null;}}

function Deck(){const [i,setI]=useState(0);const [scale,setScale]=useState(1);const total=SLIDES.length;
  useEffect(()=>{const fit=()=>setScale(Math.min(window.innerWidth/1280,window.innerHeight/720));fit();window.addEventListener("resize",fit);return()=>window.removeEventListener("resize",fit);},[]);
  const go=useCallback(d=>setI(p=>Math.max(0,Math.min(total-1,p+d))),[total]);
  const jump=useCallback(n=>setI(Math.max(0,Math.min(total-1,n))),[total]);
  useEffect(()=>{const onKey=e=>{if(["ArrowRight"," ","PageDown","ArrowDown"].includes(e.key)){e.preventDefault();go(1);}else if(["ArrowLeft","PageUp","ArrowUp"].includes(e.key)){e.preventDefault();go(-1);}else if(e.key==="Home")jump(0);else if(e.key==="End")jump(total-1);else if(e.key==="f"||e.key==="F"){const el=document.documentElement;if(!document.fullscreenElement)el.requestFullscreen&&el.requestFullscreen();else document.exitFullscreen&&document.exitFullscreen();}};window.addEventListener("keydown",onKey);return()=>window.removeEventListener("keydown",onKey);},[go,jump,total]);
  const s=SLIDES[i];
  return(<div className="viewport"><div className="stage" style={{transform:`scale(${scale})`}}>
    <div className="stage-bg"><div className="orb a"></div><div className="orb b"></div><div className="orb c"></div><div className="grid-tex"></div></div>
    <div className="progress" style={{width:(i/(total-1)*100)+"%"}}></div>
    <div key={i} className="slidewrap"><Kicker i={i}/><div className="pageno"><b>{String(i+1).padStart(2,"0")}</b> / {String(total).padStart(2,"0")}</div><Body s={s}/></div>
    <div className="dots">{SLIDES.map((_,k)=>(<div key={k} className={"dot"+(k===i?" on":"")} onClick={()=>jump(k)}></div>))}</div>
    <div className="nav">
      <div className="navbtn glass" onClick={()=>go(-1)}><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
      <div className="navbtn glass" onClick={()=>go(1)}><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
    </div>
  </div></div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Deck/>);
</script>
</body>
</html>
